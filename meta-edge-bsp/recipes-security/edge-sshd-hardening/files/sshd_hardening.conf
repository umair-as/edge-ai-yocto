# EDGE AI OS sshd hardening drop-in. Auth policy + crypto policy.
#
# Loaded by openssh via the default `Include /etc/ssh/sshd_config.d/*.conf`
# directive at the top of /etc/ssh/sshd_config. Filename prefix `99-` makes
# this the last drop-in processed; values here override any earlier file.

# --- Access policy --------------------------------------------------------

# devel is the only SSH-reachable user. Root login locked at the SSH layer;
# physical-serial root login is still allowed (login policy lives in PAM +
# securetty, not here). To onboard a new SSH user, add them to the devel
# group instead of editing this list — keeps policy auditable.
AllowUsers devel
PermitRootLogin no

# Allow both auth methods. Password is the dev EVK fallback; pubkey is
# preferred. Prod-debug / prod tiers set PasswordAuthentication no via a tier drop-in.
PasswordAuthentication yes
PubkeyAuthentication yes

# Disable everything else — clear surface, no quiet fallbacks.
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
HostbasedAuthentication no
PermitEmptyPasswords no

# --- Host keys ------------------------------------------------------------
#
# OE-Core's stock sshd_config declares only `HostKey /etc/ssh/ssh_host_ecdsa_key`.
# Any explicit HostKey directive replaces sshd's built-in defaults. ed25519 is
# the sole host key: universally supported since OpenSSH 6.5, instant to
# generate (no RSA keygen cost), and the only type in HostKeyAlgorithms below.
HostKey /etc/ssh/ssh_host_ed25519_key

# --- Session policy -------------------------------------------------------

MaxAuthTries 6
LoginGraceTime 30
MaxSessions 4
MaxStartups 10:30:60

# Keepalive: client must respond every 5 min × 2 strikes = 10 min idle max.
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Crypto policy --------------------------------------------------------
#
# Modern primitives only. Drops legacy CBC ciphers, sha1 MACs, dh-group1.
# Sourced from Mozilla's "modern" sshd profile (2025-02 revision) intersected
# with what OpenSSH 9.x in oe-core wrynose actually ships.

KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,sntrup761x25519-sha512@openssh.com,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com
# Host-key offer: ed25519 only (matches the single HostKey above). User-auth
# (PubkeyAcceptedAlgorithms) still allows rsa-sha2 so operators may log in with
# an RSA *client* key — that is independent of the server's host-key type.
HostKeyAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com
PubkeyAcceptedAlgorithms ssh-ed25519,ssh-ed25519-cert-v01@openssh.com,rsa-sha2-512,rsa-sha2-256

# --- Misc ----------------------------------------------------------------

# PAM prints /etc/motd on session open; let it own that surface to avoid
# the double-print sshd's PrintMotd causes. PrintLastLog stays on because
# PAM does not print it by default.
PrintMotd no
PrintLastLog yes
TCPKeepAlive no
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
PermitTunnel no
PermitUserEnvironment no

# Strict authorized_keys ownership: root cannot pre-populate someone else's
# ~/.ssh/authorized_keys — devel's keys come from the image build path
# (EDGE_DEVEL_SSH_PUBKEY_FILE → /home/devel/.ssh/authorized_keys, baked
# 0600 owned by devel:devel).
StrictModes yes
