# Legacy uImage format remains off. Renesas defconfig already disables
# this; explicit reassertion catches a future defconfig sync re-enable.
# Fresh media boots slot A's signed verity FIT before userspace seeds the
# redundant managed environment. Existing deployments retain their saved env.
# CONFIG_LEGACY_IMAGE_FORMAT is not set
CONFIG_USE_BOOTCOMMAND=y
# bootm needs the explicit #conf-A selector: without it this U-Boot fails
# config selection ("Could not find configuration node") despite the FIT's
# default property. loadaddr on fresh media comes from the distro default env.
CONFIG_BOOTCOMMAND="if mmc dev 0; then if ext4load mmc 0:1 ${loadaddr} fitImage-A; then setenv bootargs; bootm ${loadaddr}#conf-A; fi; fi; reset"
