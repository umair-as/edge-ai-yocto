# STACKPROTECTOR is at the defconfig default (off). U-Boot 2024.07 ships
# the runtime (common/stackprot.c); enabling is unverified on this
# toolchain. merge_config.sh parses comment lines starting "# CONFIG_<sym>"
# as assignments — the prefix is omitted here for that reason.

# USB host mode is unused surface: not in boot_targets; RZ/V2L boots from
# eSD via SoC mask ROM. The HCD disables deselect USB_HOST; XHCI_RCAR and
# USB_STORAGE are hidden children and drop from the resolved config.
# Gadget side (RENESAS_USBHS, ums) remains — ums is the eMMC flash path.
# CONFIG_CMD_USB is not set
# CONFIG_USB_STORAGE is not set
# CONFIG_USB_XHCI_HCD is not set
# CONFIG_USB_EHCI_HCD is not set

# Serial download (Kermit, S-record) — no flash flow uses it.
# CONFIG_CMD_LOADB is not set
# CONFIG_CMD_LOADS is not set
