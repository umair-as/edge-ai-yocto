# CONFIG_STACKPROTECTOR is intentionally left at defconfig default.
# U-Boot 2024.07 declares the Kconfig symbol but ships no lib/stack_protector.c —
# enabling it routes -fstack-protector through KCFLAGS, GCC emits __stack_chk_*
# references, and link fails with no runtime symbols. Wiring needs an upstream
# backport of lib/stack_protector.c from a later U-Boot tag.

# USB host stack at U-Boot — not in boot_targets. RZ/V2L boots from eSD
# via SoC mask ROM; USB enumeration at U-Boot is unused surface.
# CONFIG_CMD_USB is not set
# CONFIG_USB_STORAGE is not set

# Serial download (Kermit, S-record) — no flash flow uses it.
# CONFIG_CMD_LOADB is not set
# CONFIG_CMD_LOADS is not set
