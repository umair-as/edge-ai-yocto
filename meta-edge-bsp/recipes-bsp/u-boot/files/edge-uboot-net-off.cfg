# Network commands disabled in lockdown-default builds. EDGE_DEV_NETBOOT=1
# builds skip this fragment so the netboot env macro can drive TFTP fetch
# of the FIT. Net core (NET, ETH, BOOTDEV_ETH) remains compiled in.
# DHCP/TFTPBOOT are CMD_NET children — hidden from the resolved config
# once the parent is off; the explicit lines cover a parent re-enable.
# CONFIG_CMD_NET is not set
# CONFIG_CMD_DHCP is not set
# CONFIG_CMD_TFTPBOOT is not set
