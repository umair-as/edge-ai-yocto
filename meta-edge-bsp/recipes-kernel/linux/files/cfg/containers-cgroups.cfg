# Namespaces + cgroups for containerized workloads.
# Required by Docker, Podman, containerd, k3s, balena-engine, systemd-nspawn.

CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y

CONFIG_CGROUPS=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_MEMCG=y
CONFIG_CGROUP_BPF=y
# CPU bandwidth control — enforces --cpus quota on podman run.
CONFIG_CFS_BANDWIDTH=y
# Block I/O throttling via blkio cgroup (--device-read-bps / --device-write-bps).
CONFIG_BLK_DEV_THROTTLING=y
