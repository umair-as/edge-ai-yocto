# EDGE AI OS kernel hardening + DM_VERITY infrastructure.
#
# Applied as a kconfig fragment via linux-cip_%.bbappend SRC_URI.
# Symbols here are the cross-section of "current CIP 6.12 LTS supports"
# and "matters for the hardening posture we're targeting":
#
# - userspace memory-corruption mitigations (PIE, SSP, FORTIFY are
#   compiler/glibc-side via security_flags.bbclass; the kernel-side
#   equivalents below stiffen the kernel's own surface)
# - randomization (KASLR, randomize-kstack)
# - init-on-alloc / init-on-free as kernel defaults
# - module signing infrastructure (enforcement deferred to prod tier)
# - dm-verity infrastructure (enforcement deferred — see CRA-CONTROLS.md)
#
# Symbols already enabled by linux-cip's defconfig are deliberately
# re-declared here so this fragment documents the policy explicitly.
#
# Regenerate against a new linux-cip version:
#   bitbake -c menuconfig linux-cip      → toggle symbols → savedefconfig
#   diff defconfig against this fragment; add new symbols here.

# --- Kernel self-protection ------------------------------------------------

CONFIG_HARDENED_USERCOPY=y
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_STRONG=y
CONFIG_FORTIFY_SOURCE=y

# Initialize stack memory to zero on function entry. Catches a class of
# uninitialized-stack-read CVEs. Default-on at runtime via cmdline; the
# kconfig says "build with the option available".
CONFIG_INIT_STACK_ALL_ZERO=y

# Initialize heap/page allocations to zero. Defaults the runtime knob
# init_on_alloc / init_on_free to ON without the cmdline param. Adds
# small perf cost; CRA-correct.
CONFIG_INIT_ON_ALLOC_DEFAULT_ON=y
CONFIG_INIT_ON_FREE_DEFAULT_ON=y

# Slab freelist randomization + hardened metadata. Block heap-overflow
# exploits that depend on deterministic next-free pointers.
CONFIG_SLAB_FREELIST_RANDOM=y
CONFIG_SLAB_FREELIST_HARDENED=y

# KASLR base + kernel-stack-offset randomization.
CONFIG_RANDOMIZE_BASE=y
CONFIG_RANDOMIZE_KSTACK_OFFSET=y
CONFIG_RANDOMIZE_KSTACK_OFFSET_DEFAULT=y

# Block the legacy "auto-load any line discipline" path. CVE-2017-2636 etc.
# CONFIG_LDISC_AUTOLOAD is not set

# TCP SYN cookies — basic SYN-flood mitigation. Absent from linux-cip
# 6.12's default config (confirmed on-device: net.ipv4.tcp_syncookies
# write fails with ENOENT). Once this lands, the sysctl drop-in writing
# `1` to it actually takes effect.
CONFIG_SYN_COOKIES=y

# Block kexec — no live-kernel-replacement on a verified-boot system.
# CONFIG_KEXEC is not set
# CONFIG_KEXEC_FILE is not set

# /proc/kcore is a mapping of the running kernel's memory. Useful for
# debug; a CVE vector for unprivileged read attempts. Off in dev too.
# CONFIG_PROC_KCORE is not set

# Disable legacy ABIs and obsolete syscalls.
# CONFIG_LEGACY_PTYS is not set
# CONFIG_LEGACY_TIOCSTI is not set
# CONFIG_BPF_UNPRIV_DEFAULT_OFF — backstop for kernel.unprivileged_bpf_disabled.
CONFIG_BPF_UNPRIV_DEFAULT_OFF=y

# --- Module signing ---------------------------------------------------------
#
# Sign modules at build time; verify on load. We turn the infrastructure
# ON but do NOT require signed modules yet (MODULE_SIG_FORCE=n) — that's a
# prod-tier gate once we have an in-tree signing key flow. dev iteration
# can still insmod test modules without signature.

CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_FORMAT=y
CONFIG_MODULE_SIG_SHA512=y
CONFIG_MODULE_SIG_HASH="sha512"
# CONFIG_MODULE_SIG_FORCE is NOT set — flip to "=y" in the prod fragment.

# --- DM-VERITY infrastructure ---------------------------------------------
#
# Kernel can verify a dm-verity volume the moment the boot flow asks for
# one. Enforcement (mounting rootfs as /dev/dm-0 with verity options on
# the kernel cmdline) is deferred — see docs/security/CRA-CONTROLS.md.

CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_DM_VERITY_FEC=y
# CONFIG_DM_VERITY_HASH_PREFETCH — added upstream in linux 6.13. Not a
# user-visible symbol in CIP 6.12 yet; would silently no-op. Reactivate
# the line when CIP rolls past 6.13.
CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG=y
CONFIG_DM_INIT=y

# --- Audit subsystem ------------------------------------------------------

CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
# CONFIG_AUDIT_WATCH and CONFIG_AUDIT_TREE are `def_bool y` in
# init/Kconfig when CONFIG_AUDITSYSCALL=y. Auto-set, never emitted to
# the resolved .config. Explicit lines are harmless but noisy in
# config-delta audits — they look like "missing" when they're not.

# --- IMA / EVM (infrastructure only; enforcement deferred to prod) -------

CONFIG_INTEGRITY=y
CONFIG_INTEGRITY_AUDIT=y
CONFIG_IMA=y
CONFIG_IMA_MEASURE_PCR_IDX=10
CONFIG_IMA_LSM_RULES=y
# Log every measurement (no dedup). Default is htable-dedup ON, which
# silently skips repeat measurements — defeats the "ready for prod
# enforcement" posture below and triggers a kernel notice at boot.
CONFIG_IMA_DISABLE_HTABLE=y
CONFIG_EVM=y
# IMA_APPRAISE deferred — kernel cmdline `ima_appraise=enforce` needed
# in a tier fragment, plus signed-policy chain. See CRA-CONTROLS.md.

# --- LSM stack ------------------------------------------------------------
#
# AppArmor is NOT carried — no profile set, never will be. SELinux is the
# active MAC. BOOTPARAM=y keeps `selinux=0` as the recovery escape;
# DEVELOP=y allows per-domain permissive during bring-up. enforcing=0|1
# is set via kernel cmdline (rauc_set_bootargs reads EXTRA_KERNEL_ARGS,
# defaulted in rauc-uboot-env.defaults). Yama is the non-exclusive
# ptrace-restriction LSM, complementary to the active MAC.

CONFIG_SECURITY=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITYFS=y
# CONFIG_SECURITY_APPARMOR is not set
CONFIG_SECURITY_YAMA=y

CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_AVC_STATS=y
CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9

# Default MAC. lockdown→yama→bpf→landlock→selinux is the upstream
# canonical order; selinux MUST be last so its hooks see post-LSM
# context. Strict prod-tier enforcement is gated by a profile fragment.
CONFIG_DEFAULT_SECURITY_SELINUX=y
CONFIG_LSM="lockdown,yama,bpf,landlock,selinux"

# Heap + slab self-protection.
CONFIG_RANDOM_KMALLOC_CACHES=y
CONFIG_SHUFFLE_PAGE_ALLOCATOR=y
# Build-time disable of slab merging; matches `slab_nomerge` on the cmdline.
# CONFIG_SLAB_MERGE_DEFAULT is not set
CONFIG_LIST_HARDENED=y
CONFIG_BUG_ON_DATA_CORRUPTION=y

# Page-table integrity — every kernel PT write goes through a verify step.
CONFIG_PAGE_TABLE_CHECK=y
CONFIG_PAGE_TABLE_CHECK_ENFORCED=y

# KFENCE sampled allocator. 100 ms sample interval per KSPP guidance.
CONFIG_KFENCE=y
CONFIG_KFENCE_SAMPLE_INTERVAL=100

# UBSAN bounds + trap-on-fault. Modest .text growth, ~0 runtime cost on
# non-faulting paths. SANITIZE_ALL covers the full kernel.
CONFIG_UBSAN=y
CONFIG_UBSAN_BOUNDS=y
CONFIG_UBSAN_TRAP=y
CONFIG_UBSAN_SANITIZE_ALL=y

# CONFIG_LSM above lists lockdown; this enables the symbol and early
# activation. Boot-time mode stays NONE — lockdown is available but
# inactive until cmdline `lockdown=integrity` activates it. Forcing
# confidentiality at Kconfig blocks unsigned module load, which
# requires module-signing infrastructure to be wired first.
CONFIG_SECURITY_LOCKDOWN_LSM=y
CONFIG_SECURITY_LOCKDOWN_LSM_EARLY=y
CONFIG_LOCK_DOWN_KERNEL_FORCE_NONE=y

# CONFIG_LSM above lists landlock; this enables the symbol.
CONFIG_SECURITY_LANDLOCK=y

# dmesg read restricted to CAP_SYSLOG by default.
CONFIG_SECURITY_DMESG_RESTRICT=y

# CONFIG_DEVMEM stays on for hwtools (devmem2); IO_STRICT_DEVMEM restricts
# the allowed ranges to non-conflict regions.
CONFIG_IO_STRICT_DEVMEM=y

# /proc/PID/mem write hardening — disallows force-override of the lookup
# semantics that previously allowed cross-uid write tricks.
CONFIG_PROC_MEM_NO_FORCE=y

# Core scheduler — process-level isolation for SMT side-channels. RZ/V2L
# has no SMT so this is dormant on this board.
CONFIG_SCHED_CORE=y

# Boot-time debug aids. DEBUG_WX warns on W+X mappings during init;
# DEBUG_VIRTUAL validates virt_to_phys; DEBUG_SG validates scatter-gather
# use; DEBUG_NOTIFIERS validates notifier chains.
CONFIG_DEBUG_WX=y
CONFIG_DEBUG_VIRTUAL=y
CONFIG_DEBUG_SG=y
CONFIG_DEBUG_NOTIFIERS=y

# Wireless stack — no Wi-Fi / 802.11 radio on this SoC family. meta-renesas
# defconfig brings the full stack in by default; cfg80211 then unconditionally
# requests /lib/firmware/regulatory.db at init and ENOENT-spams dmesg. The
# stack is also a non-trivial attack surface for hardware that does not exist.
# CONFIG_WIRELESS is not set
# CONFIG_CFG80211 is not set
# CONFIG_MAC80211 is not set
# CONFIG_WLAN is not set

# Suspend-to-disk: fixed appliance, no battery state to save.
# CONFIG_HIBERNATION is not set

# Kernel same-page merging: dedup for memory-pressured VM hosts. Not
# relevant on a single-tenant edge node.
# CONFIG_KSM is not set

# /dev/port — x86 I/O port access. ARM64 has no port I/O space.
# CONFIG_DEVPORT is not set

# Staging drivers — out-of-tree / pre-merge code. No staging driver is
# selected by the current build set.
# CONFIG_STAGING is not set
