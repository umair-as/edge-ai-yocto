# dm-crypt + dm-integrity + userspace crypto API (algif_*) for cryptsetup
# / LUKS2. Consumers: writable-partition LUKS2 and RAUC bundle-formats=crypt.
#
# Without CRYPTO_USER_API_SKCIPHER, cryptsetup fails with "Required kernel
# crypto interface not available" even when DM_CRYPT is built in.

# DM core. Asserted here so this fragment stands alone; defconfig has
# BLK_DEV_DM=m.
CONFIG_BLK_DEV_DM=y
CONFIG_DM_BUFIO=y

CONFIG_DM_CRYPT=y
CONFIG_DM_INTEGRITY=y

CONFIG_CRYPTO_XTS=y
CONFIG_CRYPTO_ESSIV=y

CONFIG_CRYPTO_USER_API_SKCIPHER=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_AEAD=y
