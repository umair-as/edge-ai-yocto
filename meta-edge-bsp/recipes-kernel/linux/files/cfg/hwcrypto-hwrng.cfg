# Expose hardware-backed entropy and ARMv8 crypto acceleration.

# OP-TEE kernel interfaces — /dev/tee0 serves clients and /dev/teepriv0 serves
# tee-supplicant. OPTEE is the Kconfig parent of HW_RANDOM_OPTEE below.
# meta-renesas defconfig carried TEE and OPTEE at cip7 and dropped them at
# cip14; pin them against drift that would remove the Linux TEE interfaces.
CONFIG_TEE=y
CONFIG_OPTEE=y

# OP-TEE HWRNG requires the OP-TEE runtime and HWRNG PTA.
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_OPTEE=y

# Linux 6.12 removed RANDOM_TRUST_BOOTLOADER and credits bootloader RNG seeds
# by default. random.trust_bootloader=off disables crediting; it governs
# /chosen/rng-seed, not the independently consumed /chosen/kaslr-seed.

# ARMv8 cryptographic extensions (CPU instruction acceleration).
CONFIG_CRYPTO_SHA1_ARM64_CE=y
CONFIG_CRYPTO_SHA2_ARM64_CE=y
CONFIG_CRYPTO_GHASH_ARM64_CE=y
CONFIG_CRYPTO_AES_ARM64=y
CONFIG_CRYPTO_AES_ARM64_CE=y
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y
CONFIG_CRYPTO_AES_ARM64_CE_CCM=y
