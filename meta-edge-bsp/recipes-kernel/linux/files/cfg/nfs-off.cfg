# Network filesystems off: no image mounts NFS, roots from NFS or runs
# rpcbind/statd. arm64 defconfig builds the NFS client, NFS-root and kernel
# IP autoconfiguration in; SUNRPC, RPCSEC_GSS, LOCKD and GRACE_PERIOD are
# select-only and drop out with NFS_FS. EDGE_DEV_NETBOOT=1 builds skip this
# fragment (NFS-root dev netboot).
# CONFIG_NFS_FS is not set
# CONFIG_NFSD is not set
# CONFIG_IP_PNP is not set
