# AI / compute / media-pipeline primitives.
#
# Scope: what every on-device inference workload needs at the kernel level —
# camera capture (V4L2), large contiguous memory (CMA + hugepages), zero-copy
# buffer sharing between userspace processes and accelerators (DMABUF heaps).
#
# Out of scope:
#   - DRP-AI driver enablement       — deferred (vendor-kernel coupling).
#   - GPU driver selection           — left to the BSP machine config.
#   - DRM core (CONFIG_DRM)          — Weston pulls this in; the assertion
#                                       below is defensive, not load-bearing.

# ----- V4L2 capture for camera-based inference (USB UVC + on-SoC ISP) -----
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_CONTROLLER=y
CONFIG_MEDIA_CAMERA_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_V4L2_MEM2MEM_DEV=y
CONFIG_USB_VIDEO_CLASS=m

# ----- DMABUF: zero-copy buffer sharing across V4L2 / GPU / accelerators -----
CONFIG_DMA_SHARED_BUFFER=y
CONFIG_DMABUF_HEAPS=y
CONFIG_DMABUF_HEAPS_SYSTEM=y
CONFIG_DMABUF_HEAPS_CMA=y

# ----- CMA: contiguous physical memory for inference tensors + DMA pools -----
CONFIG_CMA=y
CONFIG_CMA_AREAS=7
CONFIG_DMA_CMA=y

# ----- Hugepages: 2 MiB / 1 GiB pages for inference runtimes (ORT, TFLite) -----
CONFIG_HUGETLBFS=y
CONFIG_HUGETLB_PAGE=y
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y

# ----- DRM core — defensive assertion (Weston usually pulls this anyway) -----
CONFIG_DRM=y
