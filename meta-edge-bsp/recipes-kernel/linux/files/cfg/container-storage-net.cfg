# Container storage + networking primitives.
#
# What this enables:
#   - OverlayFS for container image layering (Docker, Podman, containerd).
#   - veth/bridge/MACVLAN/IPVLAN for container network namespaces.
#   - TUN/TAP for rootless networking (slirp4netns) and VPN containers.
#   - br_netfilter so iptables/nftables hooks run on bridged container traffic.
#   - NF_TABLES for modern Docker/Podman firewall backends.
#
# What this does NOT touch (avoid duplication with sibling fragments):
#   - DM_VERITY / BLK_DEV_DM / LOOP / SQUASHFS — already in rauc-verity.cfg
#   - Namespaces / cgroups                     — already in containers-cgroups.cfg

# ----- Overlay storage driver (native overlay; fuse-overlayfs not used) -----
CONFIG_OVERLAY_FS=y

# ----- Container networking primitives -----
CONFIG_VETH=y
CONFIG_BRIDGE=y
CONFIG_LLC=y
CONFIG_STP=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_MACVLAN=y
CONFIG_IPVLAN=y
CONFIG_TUN=y
CONFIG_VLAN_8021Q=y

# ----- Netfilter / nftables (netavark firewall backend) -----
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_CONNTRACK=y
# connmark — netavark marks connections to isolate traffic between
# container networks. CIP 6.12 defconfig leaves this unset.
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NF_DEFRAG_IPV4=y
CONFIG_NF_DEFRAG_IPV6=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_CT=y
CONFIG_NFT_FIB_IPV4=y
CONFIG_NFT_FIB_IPV6=y
CONFIG_NFT_FIB_INET=y
CONFIG_NF_NAT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
# netavark rule expressions: reject for inter-network isolation, log + limit.
CONFIG_NFT_REJECT=y
CONFIG_NFT_REJECT_INET=y
CONFIG_NFT_LOG=y
CONFIG_NFT_LIMIT=y

# ----- xtables matches (defconfig-provided; netavark is nft-native and does
# not use these — retained so an iptables-nft fallback path still resolves) -----
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_MANGLE=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
# nfmark match/target; resolves once NF_CONNTRACK_MARK is enabled above.
CONFIG_NETFILTER_XT_MARK=y
