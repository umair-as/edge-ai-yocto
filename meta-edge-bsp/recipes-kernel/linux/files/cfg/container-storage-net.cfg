# Container storage + networking primitives.
#
# What this enables:
#   - OverlayFS for container image layering (Docker, Podman, containerd).
#   - veth/bridge/MACVLAN for container network namespaces.
#   - TUN/TAP for rootless networking (slirp4netns) and VPN containers.
#   - br_netfilter so iptables/nftables hooks run on bridged container traffic.
#   - NF_TABLES for the netavark nftables firewall driver. nftables only:
#     the legacy x_tables engine (iptables-legacy) is off; netavark,
#     nft and iptables-nft all run on nf_tables.
#
# What this does NOT touch (avoid duplication with sibling fragments):
#   - DM_VERITY / BLK_DEV_DM / LOOP / SQUASHFS — already in rauc-verity.cfg
#   - Namespaces / cgroups                     — already in containers-cgroups.cfg

# ----- Overlay storage driver (native overlay; fuse-overlayfs not used) -----
CONFIG_OVERLAY_FS=y

# ----- Container networking primitives -----
CONFIG_VETH=y
CONFIG_BRIDGE=y
CONFIG_LLC=y
CONFIG_STP=y
CONFIG_BRIDGE_NETFILTER=y
CONFIG_MACVLAN=y
# Not used by any container network; IPVLAN_L3S also selects L3_MASTER_DEV.
# CONFIG_IPVLAN is not set
# CONFIG_NET_L3_MASTER_DEV is not set
CONFIG_TUN=y
CONFIG_VLAN_8021Q=y

# ----- Netfilter / nftables (netavark firewall backend) -----
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NF_CONNTRACK=y
# connmark — netavark marks connections to isolate traffic between
# container networks. Set explicitly rather than relying on the provider defconfig.
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NF_DEFRAG_IPV4=y
CONFIG_NF_DEFRAG_IPV6=y
CONFIG_NF_TABLES=y
CONFIG_NF_TABLES_INET=y
CONFIG_NF_TABLES_IPV4=y
CONFIG_NF_TABLES_IPV6=y
CONFIG_NFT_CT=y
CONFIG_NFT_FIB_IPV4=y
CONFIG_NFT_FIB_IPV6=y
CONFIG_NFT_FIB_INET=y
CONFIG_NF_NAT=y
CONFIG_NFT_NAT=y
CONFIG_NFT_MASQ=y
# netavark rule expressions: reject for inter-network isolation, log + limit.
CONFIG_NFT_REJECT=y
CONFIG_NFT_REJECT_INET=y
CONFIG_NFT_LOG=y
CONFIG_NFT_LIMIT=y

# ----- No legacy x_tables engine (iptables/ip6tables/arptables/ebtables) -----
# On 6.12 the tables below select the legacy engine, so each is set off
# explicitly; on 6.18 they depend on NETFILTER_XTABLES_LEGACY, which
# xtables-legacy-off.cfg turns off.
# CONFIG_IP_NF_IPTABLES_LEGACY is not set
# CONFIG_IP_NF_FILTER is not set
# CONFIG_IP_NF_NAT is not set
# CONFIG_IP_NF_MANGLE is not set
# CONFIG_IP_NF_RAW is not set
# CONFIG_IP_NF_SECURITY is not set
# CONFIG_IP_NF_ARPTABLES is not set
# CONFIG_IP_NF_ARPFILTER is not set
# CONFIG_IP6_NF_IPTABLES_LEGACY is not set
# CONFIG_IP6_NF_FILTER is not set
# CONFIG_IP6_NF_NAT is not set
# CONFIG_IP6_NF_MANGLE is not set
# CONFIG_IP6_NF_RAW is not set
# CONFIG_IP6_NF_SECURITY is not set
# CONFIG_BRIDGE_NF_EBTABLES_LEGACY is not set
# CONFIG_BRIDGE_EBT_BROUTE is not set
# CONFIG_BRIDGE_EBT_T_FILTER is not set
# CONFIG_BRIDGE_EBT_T_NAT is not set
# CONFIG_NETFILTER_XT_NAT is not set
# CONFIG_NETFILTER_XT_TARGET_MASQUERADE is not set
# CONFIG_NETFILTER_XT_MATCH_BPF is not set

# ----- xt matches for nft_compat (defconfig-provided; netavark is
# nft-native and does not use these) -----
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=y
# nfmark match/target; resolves once NF_CONNTRACK_MARK is enabled above.
CONFIG_NETFILTER_XT_MARK=y
