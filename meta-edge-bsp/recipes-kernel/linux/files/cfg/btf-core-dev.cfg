# BTF + un-reduced DWARF so the kernel build's pahole pass emits the .BTF
# section / /sys/kernel/btf/vmlinux — the CO-RE prerequisite for libbpf.
# Dev builds only. Single owner of the DEBUG_INFO/DWARF knobs across the dev
# fragment set: DWARF4 (not 5) is the pahole BTF-generation path; jtag-debug.cfg
# deliberately leaves these to this file.

CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_INFO_REDUCED=n
CONFIG_DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT=n
CONFIG_DEBUG_INFO_DWARF4=y
CONFIG_DEBUG_INFO_DWARF5=n
CONFIG_DEBUG_INFO_BTF=y
CONFIG_DEBUG_INFO_BTF_MODULES=y
