# OpenOCD/JTAG source-level kernel debugging — RZ/V2L Cortex-A55.
# Opt-in via EDGE_ENABLE_JTAG_DEBUG; appended after crash-debug-dev.cfg so
# the detector/KASLR overrides below win the fragment merge. Not for prod:
# KASLR off and -Og widen attack surface and change codegen.

# KASLR off — runtime addresses match vmlinux symbols 1:1 in gdb-multiarch,
# the central JTAG/source-debug win on this board.
# CONFIG_RANDOMIZE_BASE is not set

# Un-reduced DWARF for source-level stepping. The DWARF *version* is left to
# the toolchain default — not pinned here — so that when btf-core-dev.cfg is
# also enabled (its own gate) its DWARF4 wins the merge without conflict (this
# file is appended last). REDUCED=n matches btf-core-dev.cfg, so both can be on.
CONFIG_DEBUG_KERNEL=y
# CONFIG_DEBUG_INFO_REDUCED is not set

# In-tree gdb helpers (lx-ps, lx-dmesg, lx-symbols) and full symbol table.
CONFIG_GDB_SCRIPTS=y
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y

# Reliable unwind + -Og so single-step and locals are not optimized away.
CONFIG_FRAME_POINTER=y
CONFIG_CC_OPTIMIZE_FOR_DEBUGGING=y

# Operator control surface for debug sessions.
CONFIG_MAGIC_SYSRQ=y

# Lockup detectors off: halting one A55 core via JTAG stalls the peer and
# fires soft-lockup/hung-task on resume, wedging the SD/eMMC path.
# CONFIG_SOFTLOCKUP_DETECTOR is not set
# CONFIG_DETECT_HUNG_TASK is not set

# Serial kgdb/kdb alongside the OpenOCD JTAG path.
CONFIG_KGDB=y
CONFIG_KGDB_SERIAL_CONSOLE=y
CONFIG_KGDB_KDB=y
