# dm-verity + RAUC install plumbing (verity bundle mount, NBD streaming,
# loop + squashfs for bundle/image inspection).
#
# Whether verity protects only RAUC bundles at install or also runtime
# rootfs slots is determined by RAUC system.conf (bundle-formats= and
# slot.<slot>.type=), not by this fragment.

CONFIG_BLK_DEV_DM=y
CONFIG_DM_BUFIO=y
CONFIG_DM_VERITY=y

# Required for RAUC streaming backend (rauc-nbd).
CONFIG_BLK_DEV_NBD=y

# Keep bundle/image mount path available.
CONFIG_BLK_DEV_LOOP=y
CONFIG_SQUASHFS=y
# SELinux resolves squashfs to xattr-based labeling; without xattr support the
# bundle squashfs mount returns EOPNOTSUPP ("has no xattr support") and RAUC
# install fails at "mounting bundle". Required once SELinux is enabled.
CONFIG_SQUASHFS_XATTR=y
