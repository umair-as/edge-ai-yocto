# Aggressive crash/panic diagnostics for development tier only.
# Layered on top of pstore-persist.cfg (which provides the actual capture
# stack). The knobs here are unsafe defaults for fleet deployments:
# sysrq exposes a kernel control surface, the lockup detectors can fire
# under heavy legitimate load.
#
# Pulled in by EDGE_KERNEL_DEV_FRAGMENTS = "1" (default on for the dev
# image tier, off for prod).

# Function-call tracing into pstore: dump the ftrace ring buffer on the
# panic path so post-mortem can replay the last calls.
CONFIG_PSTORE_FTRACE=y

# Magic SysRq — operator-triggered control surface (kernel.sysrq sysctl
# gates which sub-commands are live at runtime).
CONFIG_MAGIC_SYSRQ=y

# Detect common hang/lockup classes at runtime. Hardlockup detector left
# off in the prod baseline — backend exists on ARM64 SMP (BUDDY default),
# but soft+hung-task are the prod-correct set; hardlockup-panic is too
# aggressive for the field without further tuning.
CONFIG_DETECT_HUNG_TASK=y
CONFIG_SOFTLOCKUP_DETECTOR=y
# CONFIG_HARDLOCKUP_DETECTOR is not set
