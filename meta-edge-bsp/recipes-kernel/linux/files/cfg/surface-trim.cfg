# Remove arm64 defconfig support for hardware and subsystems this board does
# not have. These are generic-defconfig leftovers, not choices: none of the
# code below is reachable on RZ/V2L. Cutting it shrinks the image and removes
# whole driver classes from CVE scope at build time.
#
# Deliberately NOT trimmed:
#   BLK_DEV_NBD  — RAUC HTTPS streaming install mounts the bundle over nbd.
#   USB host     — carrier hub enumerates on it; UVC capture and bring-up
#                  dongles attach there.
#   MD           — parent of BLK_DEV_DM, so dm-verity and dm-crypt need it.
#   NVMEM        — SoC eFuse/OTP framework, unrelated to NVMe.

# No hypervisor. XEN gates 20 further XEN_* symbols (dom0, backends,
# frontends, xenfs, gntdev, privcmd), all of which drop with it.
# CONFIG_XEN is not set

# RZ/V2L has no PCIe: the bus enumerates zero devices. PCI_ENDPOINT is
# device-mode support; PCI_ENDPOINT_TEST is its host-side counterpart.
# CONFIG_PCI_ENDPOINT is not set
# CONFIG_PCI_ENDPOINT_TEST is not set

# NVMe is reachable only over PCIe. NVME_CORE is selected by this and follows.
# CONFIG_BLK_DEV_NVME is not set

# RAID. Only the RAID half of the MD menu — BLK_DEV_DM stays.
# CONFIG_BLK_DEV_MD is not set

# Interconnect and cluster PMUs for IP this SoC does not integrate. The only
# perf event source present is armv8_cortex_a55; the CCI400/CCI5xx sub-options
# and ARM_CCI itself are selected by ARM_CCI_PMU and drop with it.
# CONFIG_ARM_CCI_PMU is not set
# CONFIG_ARM_CCN is not set
# CONFIG_ARM_CMN is not set
# CONFIG_ARM_SMMU_V3_PMU is not set
# CONFIG_ARM_DSU_PMU is not set

# Btrfs is registered but never mounted; podman runs the overlay driver over
# ext4 (Backing Filesystem: extfs). Root, data and boot are ext4/vfat, and
# RAUC verity bundles are squashfs.
# CONFIG_BTRFS_FS is not set

# Device-mode USB has no runtime consumer; ums flashing runs in U-Boot,
# not Linux. RENESAS_USBHS, RENESAS_USBHS_UDC, USB_ETH, LIBCOMPOSITE and
# USB_CONFIGFS depend on the parent and drop with it. Host mode is a
# separate subtree, unaffected.
# CONFIG_USB_GADGET is not set

# Both Ethernet ports are ravb on the platform bus. The stmmac core and its
# platform glue, including the RZ/V2H(P) GBETH variant, have no device to
# bind; STMMAC_PLATFORM and the DWMAC_* glue depend on it and drop with it.
# CONFIG_STMMAC_ETH is not set

# Intel PCI/PCIe NICs. RZ/V2L has no PCIe; zero PCI devices enumerate.
# CONFIG_E1000 is not set
# CONFIG_E1000E is not set

# IPv6-over-IPv4 (6in4) tunnels: none configured; the auto-created sit0
# fallback device stays down. INET_TUNNEL, NET_IP_TUNNEL, DST_CACHE and
# GRO_CELLS have no other enabled selector and drop with it.
# CONFIG_IPV6_SIT is not set

# No 9p mounts or host shares. The fd/virtio transports and the 9p
# filesystem depend on it and drop with it, and with them NETFS_SUPPORT,
# which nothing else enabled selects.
# CONFIG_NET_9P is not set
