# Developer observability + tracing — for tracing AI / container workloads
# with bpftrace, perf, bpftool, py-spy, opensnoop, execsnoop, etc.
#
# DEV BUILDS ONLY. Wire this fragment from the dev image variant; keep it
# out of production. Reasons:
#   - kallsyms + BTF + DWARF debug info inflate kernel image size noticeably.
#   - kprobes/uprobes/perf widen the kernel attack surface; production
#     should lock these down via security-prod.cfg (Phase 2).

# Symbol visibility for stack traces and attach by name
CONFIG_KALLSYMS=y

# eBPF core
CONFIG_BPF=y
CONFIG_BPF_SYSCALL=y
CONFIG_BPF_JIT=y
CONFIG_CGROUP_BPF=y
CONFIG_BPF_EVENTS=y

# Tracing + perf plumbing used by bpftrace / perf / bpftool attach paths
CONFIG_PERF_EVENTS=y
CONFIG_TRACING=y
CONFIG_TRACEPOINTS=y
CONFIG_FTRACE=y
CONFIG_FUNCTION_TRACER=y
CONFIG_FUNCTION_GRAPH_TRACER=y
CONFIG_FTRACE_SYSCALLS=y

# Probe events for attaching to kernel / userspace functions
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBES=y
CONFIG_UPROBE_EVENTS=y
