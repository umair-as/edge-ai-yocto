# Prod-safe pstore RAM backend + panic policy.
#
# Captures the kernel's last messages into a 256 KB reserved-memory
# region declared by the matching DT patch
# (patches/0005-arm64-dts-rzg2l-smarc-som-add-ramoops-reserved-memory.patch).
# U-Boot doesn't zero RAM on warm reset, so contents survive into the
# next boot under /sys/fs/pstore/.
#
# Userspace archival to /data/crash/pstore is handled by the
# edge-pstore-persist recipe (mount unit + drop-in + prune).

# --- Capture stack -------------------------------------------------------
#
# Symbols deliberately NOT set: PSTORE_DEFAULT_KMSG_BYTES (gated by EXPERT;
# fragment line is a no-op), PSTORE_COMPRESS (default y).

CONFIG_PSTORE=y
CONFIG_PSTORE_RAM=y
CONFIG_PSTORE_CONSOLE=y
CONFIG_PSTORE_PMSG=y

# --- Panic / oops policy -------------------------------------------------

# Turn any oops into a full panic — CRA posture: a corrupted kernel state
# must not keep running. Pairs with PANIC_TIMEOUT so the device reboots
# into the recovery slot rather than hanging.
# (PANIC_ON_OOPS_VALUE auto-derives to 1 when PANIC_ON_OOPS=y — no need
# to set it explicitly.)
CONFIG_PANIC_ON_OOPS=y

# Auto-reboot 10 seconds after panic. Long enough to capture the console;
# short enough to keep the field device alive.
CONFIG_PANIC_TIMEOUT=10
