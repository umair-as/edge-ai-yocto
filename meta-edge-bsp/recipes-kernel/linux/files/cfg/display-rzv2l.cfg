# RZ/V2L SMARC EVK display pipeline — built-in (=y) so a /dev/dri/card0
# appears at boot without depending on udev module autoload. CIP's default
# linux-cip config builds the DU stack as modules, which the image's
# partial kernel-modules install drops on the floor; pulling the pipeline
# in deterministically avoids that class of failure entirely.
#
# Pipeline (per SMARC RZ/V2L carrier DT, verified at runtime via
# /sys/bus/i2c/devices/1-003d → adv7535):
#   RZ/G2L Display Unit (DU) -> MIPI-DSI -> ADV7535 (DSI→HDMI bridge,
#   I²C addr 0x3d on i2c@10058400) -> HDMI-A connector.
# The bridge IC on this carrier is ADV7535, handled by the adv7511 driver
# (ADV7535 is a variant). An earlier revision of this fragment selected
# DRM_LONTIUM_LT8912B from a different board's wiring — that driver was
# never invoked at runtime. Dropped.

# Framebuffer emulation over DRM/KMS — provides /dev/fb0 for psplash.
# Without this psplash has no device to write to on a pure DRM/KMS system.
CONFIG_DRM_FBDEV_EMULATION=y

# No framebuffer console on HDMI. Serial (ttySC0 via earlycon) is the
# operator console surface. Disabling fbcon prevents it from claiming
# /dev/fb0 ahead of psplash and flooding HDMI with kernel messages.
# CONFIG_FRAMEBUFFER_CONSOLE is not set

# No kernel boot logo (Tux penguin). Depends on fbcon; belt-and-suspenders
# in case fbcon is re-enabled later.
# CONFIG_LOGO is not set

CONFIG_DRM=y
# Dependency chain that has to be built-in for DRM_RZG2L_DU=y to stick:
#   DRM_RZG2L_DU  depends on  VIDEO_RENESAS_VSP1
#   VIDEO_RENESAS_VSP1  depends on  VIDEO_RENESAS_FCP  (on ARM64)
# If any link in the chain is =m, Kconfig silently downgrades DU back to =m.
CONFIG_VIDEO_RENESAS_FCP=y
CONFIG_VIDEO_RENESAS_VSP1=y
CONFIG_DRM_RZG2L_DU=y
CONFIG_DRM_RZG2L_MIPI_DSI=y
# ADV7511 driver covers ADV7535. Already =y in CIP's default config for
# this machine; re-declared so the policy is explicit and a future CIP
# defconfig change can't silently regress it.
CONFIG_DRM_I2C_ADV7511=y
CONFIG_DRM_PANEL_BRIDGE=y
