# Upstream selects this per board through a systemd generator keyed on the
# DT compatible; the image ships the VENTUNO Q variant statically.
[Service]
ExecStart=
ExecStart=/usr/bin/arduino-router --unix-port /var/run/arduino-router.sock --serial-port /dev/ttySTM0 --serial-baudrate 115200
# TLMM lines as upstream sets them: 47 low puts the MCU in its ready state,
# 95 high ends the boot animation and 95 low restarts it, and 78 is pulsed
# low-high on stop. libgpiod 1.x syntax; the chip is opened by its label,
# not by an index that depends on the PMIC gpiochips probing first.
ExecStartPre=-/usr/bin/gpioset f100000.pinctrl 47=0
ExecStartPost=-/usr/bin/gpioset f100000.pinctrl 95=1
ExecStopPost=-/usr/bin/gpioset f100000.pinctrl 95=0
ExecStopPost=-/usr/bin/gpioset f100000.pinctrl 78=0
ExecStopPost=-/usr/bin/gpioset f100000.pinctrl 78=1
