# QRTR carries the QMI services of the remote processors (ADSP, CDSP,
# GPDSP, Wi-Fi). The defconfig gets QRTR only through ath11k's select, so
# set it explicitly. QCOM_PD_MAPPER depends on it and replaces the
# userspace pd-mapper.
CONFIG_QRTR=m
CONFIG_QRTR_SMD=m
CONFIG_QRTR_MHI=m
CONFIG_QCOM_PD_MAPPER=m
