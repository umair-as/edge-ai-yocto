# BCM2712 hardware RNG (RNG200 block at 0x7d208000), built in.
#
# Mainline bcm2712.dtsi carries no RNG node; patch 0005 adds it. The
# firmware passes no /chosen/rng-seed and U-Boot's board fixup forwards only
# kaslr-seed, so without the driver the CRNG initialises from interrupt
# timing alone, minutes after boot, blocking every getrandom(2) consumer.
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_IPROC_RNG200=y
