# On-board WiFi: Synaptics/Cypress 43455 on SDIO, driven by brcmfmac.
#
# security-hardening.cfg turns the 802.11 stack off on the grounds that the
# first board has no radio. This board has one, so the stack comes back here;
# this fragment is merged after the policy set, and the later value wins.
# Modules, as in the arm64 defconfig, so the radio is absent until the
# firmware and regulatory database are present.
CONFIG_WIRELESS=y
CONFIG_CFG80211=m
CONFIG_MAC80211=m
CONFIG_RFKILL=y
CONFIG_WLAN=y
CONFIG_WLAN_VENDOR_BROADCOM=y
CONFIG_BRCMUTIL=m
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_PROTO_BCDC=y
CONFIG_BRCMFMAC_SDIO=y
