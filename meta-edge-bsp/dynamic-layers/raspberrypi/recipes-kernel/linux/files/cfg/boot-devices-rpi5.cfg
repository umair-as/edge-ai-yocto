# SD host built in, not modular. The root filesystem is a dm-verity device
# the kernel assembles from the command line (dm-mod.create) at init; a
# modular sdhci-brcmstb makes the slot block device appear only after
# module load, and the table setup fails on a device that is not there yet.
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PLTFM=y
CONFIG_MMC_SDHCI_BRCMSTB=y
