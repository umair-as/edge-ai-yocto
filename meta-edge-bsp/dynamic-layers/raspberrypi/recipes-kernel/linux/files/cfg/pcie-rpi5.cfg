# BCM2712 PCIe host bridge built in, not modular.
#
# The arm64 defconfig ships CONFIG_PCIE_BRCMSTB=m. As a module the bus only
# appears once udev loads it, several seconds into boot and after
# systemd-modules-load has run, so anything expecting a PCI device before
# then races it. On this board RP1 (ethernet, USB) and the accelerator slot
# are behind this bridge; building it in makes the bus exist before userspace
# runs at all.
CONFIG_PCIE_BRCMSTB=y
