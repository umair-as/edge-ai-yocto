# BCM2712 PCIe host bridge and its MSI parent built in, not modular.
#
# The arm64 defconfig ships both as modules. The bridges take their MSI
# domain from the external MIP controllers (msi-parent in bcm2712.dtsi), so
# fw_devlink holds a bridge in deferred probe until the MIP driver binds: a
# built-in bridge with a modular MIP waits for udev, or for the 10 s
# deferred-probe timeout, after which it probes with no MSI domain and every
# endpoint (RP1, accelerator) fails vector allocation with -ENOTSUPP.
CONFIG_PCIE_BRCMSTB=y
CONFIG_BCM2712_MIP=y
