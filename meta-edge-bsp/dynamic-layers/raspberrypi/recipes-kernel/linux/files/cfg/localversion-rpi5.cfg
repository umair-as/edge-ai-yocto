# Kernel release string is the pinned stable version, e.g. 6.18.52.
#
# LOCALVERSION_AUTO appends the source tree's git describe suffix
# (-0000N-g<sha>) after the board patches are applied, which changes with
# every patch-set edit and leaks into module paths and package names.
# CONFIG_LOCALVERSION="" is the defconfig value.
# CONFIG_LOCALVERSION_AUTO is not set
