# 9P (Plan 9 / virtio host-folder sharing for VM guests) off: the arm64
# defconfig enables it, no board uses it. Also drops NETFS_SUPPORT, which
# nothing else selects. Per board layer, not the shared cfg/ directory:
# kernel-yocto checksums every FILESEXTRAPATHS directory, so a shared file
# would change linux-renesas, which builds 9P off already.
# CONFIG_NET_9P is not set
# CONFIG_9P_FS is not set
