# Legacy uImage format stays off. FIT_SIGNATURE already implies it; the
# explicit line catches a defconfig sync that re-enables it.
# CONFIG_LEGACY_IMAGE_FORMAT is not set
CONFIG_USE_BOOTCOMMAND=y
# Fresh media boots slot A's signed verity FIT before userspace has seeded the
# managed environment. bootm takes the FIT's own signed DTB (no firmware fdt
# argument), so /chosen/bootargs is the authenticated dm-verity command line;
# U-Boot's rpi ft_board_setup copies the firmware fixups (memory, memreserve,
# dma-ranges, kaslr-seed) into it. Explicit #conf-A selector, as on RZ/V2L.
CONFIG_BOOTCOMMAND="if mmc dev 0; then if fatload mmc 0:1 ${loadaddr} fitImage-A; then setenv bootargs; bootm ${loadaddr}#conf-A; fi; fi; reset"
