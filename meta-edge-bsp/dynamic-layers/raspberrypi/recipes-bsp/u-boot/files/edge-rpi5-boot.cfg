# Verified FIT boot and the raw-MMC environment RAUC's boot-count lives in.
# Merged onto rpi_arm64_config by merge_config.sh at do_configure.

CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_FIT_VERBOSE=y
CONFIG_RSA=y
CONFIG_SHA256=y

# A defconfig arm64 Image decompresses to well past U-Boot's default limit.
CONFIG_SYS_BOOTM_LEN=0x8000000

# Where the FIT blob is staged (loadaddr): above the kernel's load address
# (EDGE_FIT_LOADADDRESS, 0x80000) plus its decompressed size, so bootm never
# overwrites the image it is decompressing. rauc-uboot-env.defaults carries
# the same value for the managed environment.
CONFIG_SYS_LOAD_ADDR=0x08000000

# Environment in the raw MMC area before the first partition, redundant
# copies. The values are board facts (EDGE_UBOOT_ENV_* in
# conf/machine/include/edge-board-raspberrypi5.inc) and the bbappend asserts
# the resolved .config against them.
# CONFIG_ENV_IS_IN_FAT is not set
CONFIG_ENV_IS_IN_MMC=y
CONFIG_SYS_MMC_ENV_DEV=0
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0x1F0000
# ENV_REDUNDANT is the 2026.01 name of SYS_REDUNDAND_ENVIRONMENT (the RZ/V2L
# U-Boot 2024.07 still uses the old one). A stale name is silently dropped
# by merge_config and ENV_OFFSET_REDUND then never resolves; the bbappend's
# env-area assertion is what catches that.
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_OFFSET_REDUND=0x210000

# Keyed autoboot, same stop string as the RZ/V2L U-Boot.
CONFIG_BOOTDELAY=3
CONFIG_AUTOBOOT_KEYED=y
CONFIG_AUTOBOOT_PROMPT="Type 'edge' within %d seconds to stop autoboot\n"
CONFIG_AUTOBOOT_STOP_STR="edge"

# Standard-boot/EFI scanning and the pci/usb preboot are off: bootcmd is the
# RAUC slot chain and nothing else.
# CONFIG_BOOTSTD_DEFAULTS is not set
# CONFIG_USE_PREBOOT is not set
# CONFIG_EFI_LOADER is not set
# CONFIG_EFI_RUNTIME_UPDATE_CAPSULE is not set
# CONFIG_EFI_CAPSULE_FIRMWARE_RAW is not set
# CONFIG_CMD_NVEDIT_EFI is not set
# CONFIG_CMD_EFIDEBUG is not set
