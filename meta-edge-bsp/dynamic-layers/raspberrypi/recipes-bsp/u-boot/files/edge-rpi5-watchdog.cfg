# BCM2712 PM watchdog (watchdog@7d200000) driver and `wdt` command. Not
# autostarted: the managed env bootcmd starts it and boot_fit stops it before
# bootm, so the U-Boot prompt and the kernel both start with it disarmed.
CONFIG_WDT=y
CONFIG_WDT_BCM2835=y
CONFIG_CMD_WDT=y
CONFIG_WATCHDOG=y
# CONFIG_WATCHDOG_AUTOSTART is not set
CONFIG_WATCHDOG_TIMEOUT_MSECS=15000
