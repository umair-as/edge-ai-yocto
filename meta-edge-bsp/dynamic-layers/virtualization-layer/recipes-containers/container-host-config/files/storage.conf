# Overrides the meta-virtualization default storage.conf (driver = "vfs").
# VFS is a build-time workaround for image assembly under pseudo/fakeroot,
# not a runtime driver. The device runs native overlay on the persistent
# /data graphroot (var-lib-containers.mount binds /data/containers).

[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mountopt = "nodev"
