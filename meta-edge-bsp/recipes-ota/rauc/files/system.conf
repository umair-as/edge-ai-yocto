[system]
compatible=@COMPATIBLE@
bootloader=uboot
data-directory=/data/rauc
boot-attempts=3
boot-attempts-primary=3
activate-installed=true
bundle-formats=verity
perform-pre-check=true
max-bundle-signature-size=131072
prevent-late-fallback=true

[keyring]
@RAUC_KEYRING_LOCATOR@
use-bundle-signing-time=true
@RAUC_CHECK_PURPOSE_STANZA@
@RAUC_ALLOWED_SIGNER_CNS_STANZA@

[streaming]
sandbox-user=ota
tls-cert=/etc/ota/device.crt
tls-key=@TLS_KEY@
tls-ca=/etc/ota/ca.crt
send-headers=boot-id;machine-id;serial;variant;transaction-id;uptime
# Streaming install example:
#   rauc install https://<ota-host>/bundles/<bundle>.raucb
# PKCS#11 mode: tls-key=pkcs11:... and the on-device PKCS#11 library
# (engine_pkcs11 / pkcs11-provider) handles the key reference.

[log.ota]
filename=rauc-events.log
events=install;mark
format=json
max-size=512K
max-files=3

[slot.rootfs.0]
device=/dev/disk/by-rauc-slot/rootfsA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-rauc-slot/rootfsB
type=ext4
bootname=B
