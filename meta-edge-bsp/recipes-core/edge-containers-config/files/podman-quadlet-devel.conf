# Create Quadlet drop directories for the devel user (rootless containers).
# systemd-tmpfiles processes this at boot before the first user session.
# podman-user-generator scans ~/.config/containers/systemd/ for .container,
# .volume, .network files and emits per-user service units for them.
d /home/devel/.config                    0700 devel devel -
d /home/devel/.config/containers         0700 devel devel -
d /home/devel/.config/containers/systemd 0700 devel devel -

# Image-copy scratch dir: 10-edge-network.conf sets image_copy_tmp_dir =
# "storage", i.e. <graphroot>/tmp, and podman does not create it. Without it a
# rootless pull fails "creating a temporary directory: ... no such file or
# directory". Same entry as edge-ctr.tmpfiles.
d /home/devel/.local                                  0700 devel devel -
d /home/devel/.local/share                            0700 devel devel -
d /home/devel/.local/share/containers                 0700 devel devel -
d /home/devel/.local/share/containers/storage         0700 devel devel -
d /home/devel/.local/share/containers/storage/tmp     0700 devel devel -
