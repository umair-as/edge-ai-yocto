# Container runtime sysctl overrides.
#
# Loaded after 10-edge-hardening.conf (higher numeric prefix wins).
# Overrides the hardening default of user.max_user_namespaces = 0 so
# rootless podman can create user namespaces. Rootful podman is unaffected
# (it uses root-owned namespaces, not subject to this limit).
user.max_user_namespaces = 65536

# kernel.unprivileged_userns_clone is a Debian-only kernel patch not present
# in linux-renesas 6.12. The `-` prefix silently tolerates the absent key.
-kernel.unprivileged_userns_clone = 1
