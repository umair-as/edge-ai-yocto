[network]
# netavark is the podman v5 network backend; aardvark-dns provides container
# name resolution. Set explicitly so podman fails fast if the binary is absent
# rather than silently selecting another backend.
network_backend = "netavark"

# nftables firewall driver. The kernel ships a complete nf_tables set, not the
# full xtables match set (no xt_comment); netavark's default iptables driver
# aborts bridge rule setup with "Extension comment ... missing kernel module".
firewall_driver = "nftables"

[engine]
# Default image_copy_tmp_dir ("/var/tmp") is on the read-only dm-verity
# rootfs; podman pull/build fails creating its scratch dir there. "storage"
# redirects it to <graphroot>/tmp, which for rootless podman resolves under
# the user's persisted home (/data/<user>/.local/share/containers/storage).
image_copy_tmp_dir = "storage"
