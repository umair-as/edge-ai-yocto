# EDGE AI OS sysctl hardening drop-in.
#
# Loaded by systemd-sysctl at boot. CIS Distribution Independent Linux
# Benchmark Level-1-aligned defaults (where applicable to a Yocto/wrynose
# image — workstation-only items (X11 hardening) are omitted.
#
# To override a single value at runtime for triage:
#   echo 0 > /proc/sys/kernel/dmesg_restrict
# To revert system-wide: drop a file with a higher number in /etc/sysctl.d/.

# ---------------------------------------------------------------------------
# Kernel surface
# ---------------------------------------------------------------------------

# dmesg readable only by root. Hides kernel addresses + driver state from
# unprivileged users; required by many CVE mitigations to be useful.
kernel.dmesg_restrict = 1

# Hide kernel pointer values from /proc, /sys output. 2 = always hide,
# even for CAP_SYSLOG. Useful against info-leak vulns + KASLR de-randomization.
kernel.kptr_restrict = 2

# Block creation of unprivileged user namespaces. Reduces a long tail of
# privilege-escalation CVEs (CVE-2022-0185-style). Containers managed by
# rootful podman/runc still work; unprivileged user-namespace containers
# do not.
#
# The `-` prefix tells systemd-sysctl(8) / sysctl(8) to silently ignore
# this line if the key isn't writable. The knob is a Debian-only kernel
# patch — mainline / CIP 6.12 (linux-renesas) exposes equivalent controls via
# user.max_user_namespaces (handled below) and the LSM stack. Without
# the `-`, the whole drop-in fails on mainline and the unit goes
# inactive (failed), leaving NONE of the hardening applied.
-kernel.unprivileged_userns_clone = 0
# Upstream-equivalent on mainline: cap the count of user namespaces a
# non-root user can create. 0 = effectively block (root can still
# create them). Same intent, mainline-portable.
user.max_user_namespaces = 0

# Disable unprivileged BPF (programs loaded by non-CAP_SYS_ADMIN users).
# eBPF is a frequent CVE surface (verifier bugs, JIT bugs).
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2

# Disable ptrace by default for unrelated processes (PR_SET_DUMPABLE etc.
# still work for parent-child). Blocks gdb-style cross-process inspection
# but is enabled per-session via prctl by debuggers that need it.
kernel.yama.ptrace_scope = 1

# Disable kexec — no live-kernel-replacement on a verified-boot system.
# `-` prefix tolerates the key being absent. linux-renesas 6.12 builds
# without CONFIG_KEXEC by default; `-` tolerates the absent key.
-kernel.kexec_load_disabled = 1

# Refuse to load kernel modules at runtime when the kernel was booted
# without the lockdown=integrity flag. The CONFIG_MODULES_REQUIRE_SIGNED
# kernel symbol is preferred but only enforced post-boot.
# 0 here; prod-debug + prod tiers set 1 via a tier sysctl.d drop-in.
# Inline comment on the value line omitted: systemd-sysctl(8) does NOT
# strip trailing `#…` — passes the whole string to /proc/sys/kernel/modules_disabled,
# failing with "Invalid argument" and aborting the unit.
kernel.modules_disabled = 0

# Restrict perf_event access — only root can attach to other users.
kernel.perf_event_paranoid = 3

# SysRq off for prod-grade defaults; dev EVK can flip via /etc.
# (Inline comment moved to its own line — see modules_disabled note.)
kernel.sysrq = 0

# ---------------------------------------------------------------------------
# Filesystem surface
# ---------------------------------------------------------------------------

# Protect against symlink + hardlink races (CVE-2016-1583 family).
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Disable core dumps for SUID programs (they could leak secrets).
fs.suid_dumpable = 0

# ---------------------------------------------------------------------------
# Network surface (defensive)
# ---------------------------------------------------------------------------

# SYN-cookies — basic DoS mitigation. Requires CONFIG_SYN_COOKIES in
# the kernel. linux-renesas 6.12's default config doesn't enable it
# (verified by board diagnostic: `Couldn't write '1' to
# 'net/ipv4/tcp_syncookies'`); the `-` prefix tolerates the missing
# key. CONFIG_SYN_COOKIES=y is being added to security-hardening.cfg
# in the same change — once that lands, this `-` becomes a no-op (the
# key exists, the write succeeds), but the prefix stays as defense
# against a future kernel config drift silently dropping it.
-net.ipv4.tcp_syncookies = 1

# Reverse-path filter: drop packets claiming to come from an interface
# they can't be routed back through. Anti-spoofing baseline.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Don't accept ICMP redirects. The L3 router shouldn't be reshaped by
# off-path attackers on a local segment.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Don't accept "secure" ICMP redirects either (the redirect-from-gateway
# variant). Not applicable on edge/server nodes.
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0

# Don't send ICMP redirects (this is not a router).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Ignore broadcast ICMP (anti-Smurf).
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore "bogus" ICMP error responses (anti-fingerprinting + reduces log spam).
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Log packets that fail reverse-path check / arrive with impossible source
# addresses. Lands in dmesg → journald → forwarded to logging stack.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Don't accept source-routed packets. Source routing is a security anti-pattern.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# IP forwarding off — edge node, not a router.
# Enable in a tier-specific drop-in for routing use cases.
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# RFC 1337 — protect against TIME_WAIT assassination.
net.ipv4.tcp_rfc1337 = 1

# Symlink / FIFO / regular-file open hardening in world-writable dirs.
# `2` extends the sticky-bit + uid match to any non-uid-matching dir.
fs.protected_fifos = 2
fs.protected_regular = 2

# Maximum ASLR entropy. ARM64 max = 33 bits per
# Documentation/admin-guide/sysctl/vm.rst; 32-bit compat = 16.
vm.mmap_rnd_bits = 33
vm.mmap_rnd_compat_bits = 16

# IPv6 Router Advertisement processing disabled. NetworkManager owns L3
# configuration via explicit per-profile addr/route; an adversarial RA on
# the LAN cannot inject default-route or DNS overrides.
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Panic + reboot after 100 oopses. Surfaces a buggy driver while letting
# transients pass.
kernel.oops_limit = 100

# kernel.warn_limit deliberately unset — meta-renesas BSP drivers (vspm,
# mmngr) emit WARN under benign conditions; a limit would trigger
# gratuitous reboots.

# kernel.yama.ptrace_scope is 1 here (descendant-only). Prod sets 3 via
# edge-profile-prod.inc sysctl drop-in.
