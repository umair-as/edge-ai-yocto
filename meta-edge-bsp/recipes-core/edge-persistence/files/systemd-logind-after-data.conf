[Unit]
# logind scans /var/lib/systemd/linger at startup to start lingering users'
# managers. That directory binds from /data via var-lib-systemd.mount, so logind
# must order after the bind — otherwise every lingered user (devel, edge-ctr) is
# missed at boot and /run/user/<uid> is never created, so rootless user services
# (Podman Quadlets) never come up.
After=var-lib-systemd.mount
