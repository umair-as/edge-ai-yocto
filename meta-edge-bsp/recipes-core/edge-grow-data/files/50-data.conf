# systemd-repart definition used by edge-grow-data on the GPT (eMMC) layout.
# Type= must equal the /data --part-type in edge-rzv2l-emmc.wks.in;
# boot/rootfsA/rootfsB keep the generic Linux type, so repart leaves them as
# foreign partitions. Unused on MBR media (edge-grow-data.sh uses parted there).
[Partition]
Type=00fb7005-ab51-4206-9d4a-11b68e508d3a
