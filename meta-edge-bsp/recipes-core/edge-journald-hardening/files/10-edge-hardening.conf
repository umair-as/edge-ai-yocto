# EDGE AI OS journald hardening drop-in.
#
# Loaded by systemd-journald as /etc/systemd/journald.conf.d/10-edge-hardening.conf.
# Each line overrides the corresponding default in /etc/systemd/journald.conf.

[Journal]

# Persistent storage. Default on most images is "auto" — promote to runtime
# until /var/log/journal exists; we want it persistent across boots so the
# audit trail survives a reboot for triage.
Storage=persistent

# Compress journal segments. Cheap at write; saves real disk on a
# 4 GB rootfs slot.
Compress=yes

# Disk usage + retention caps. 200M total / 30-day max for the system
# journal — leaves /data headroom for the audit log (separate tier)
# and per-app structured telemetry (DRP-AI, edge inference). The 2G
# SystemKeepFree floor is a hard refuse-to-grow guard for /data
# pressure regardless of cap. Rotation is automatic on any breach.
SystemMaxUse=200M
SystemMaxFileSize=50M
SystemMaxFiles=10
MaxRetentionSec=30d
SystemKeepFree=2G

# Forwarding policy: no syslog daemon in this image (rsyslog/syslog-ng absent);
# do NOT forward to /dev/kmsg (creates infinite loops on
# kernel-message-heavy systems), DO forward to wall ONLY for emergency.
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToWall=no

# Rate limiting: 1000 messages per 30s per unit — ceiling above normal
# log volume, low enough to detect runaway producers.
RateLimitIntervalSec=30s
RateLimitBurst=1000

# Forward-secure sealing (FSS) was upstream-deprecated in systemd 257
# and effectively removed thereafter; wrynose ships systemd 259 with no
# FSS support compiled in. `Seal=yes` is silently ignored — leaving it
# would be misleading. Log integrity at rest is now the structural
# hash chain (validated by `journalctl --verify`) plus forwarding to a
# sealed upstream aggregator when that lands.
