# tmpfiles.d entry for journald persistent-storage.
#
# /var/log is a real directory in the rootfs (the volatile-log fs-perms table
# is dropped in edge-floor.inc) and is bind-mounted from /data/log by
# edge-persistence's var-log.mount. tmpfiles runs after local-fs.target so
# this entry lands inside the bound /data/log dir — net path on disk is
# /data/log/journal/<machine-id>/.
#
# Mode 2755 + group systemd-journal matches the upstream convention: group
# read for `journalctl` without sudo, setgid keeps subdirs in the right group.
d /var/log/journal 2755 root systemd-journal -
