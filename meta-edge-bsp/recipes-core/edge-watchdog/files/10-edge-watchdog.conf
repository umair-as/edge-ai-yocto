[Manager]
# Arm /dev/watchdog0 (Renesas RZ/G2L WDT) at runtime; PID 1 pings at half
# the interval. Fires only when PID 1 stops being scheduled — a hard kernel
# hang or PID 1 deadlock that panic_on_oops cannot reach. Backs the
# panic -> reboot -> RAUC recovery-slot path.
# 30s is within the 60s hardware ceiling (wdt0 timeout-sec in the SOM dtsi).
RuntimeWatchdogSec=30

# Watchdog held across the shutdown/reboot transition, clamped by the driver
# to the 60s hardware ceiling. Catches a stall in the reboot path.
RebootWatchdogSec=60
