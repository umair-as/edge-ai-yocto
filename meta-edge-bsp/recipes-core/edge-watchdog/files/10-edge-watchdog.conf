[Manager]
# Arm /dev/watchdog0 (RZ/V2L: RZ/G2L WDT; Pi 5: BCM2835 PM WDT) at runtime;
# PID 1 pings at half the interval. Fires only when PID 1 stops being
# scheduled — a hard kernel hang or PID 1 deadlock that panic_on_oops cannot
# reach. Backs the panic -> reboot -> RAUC recovery-slot path.
# Hardware maximum: 60 s on RZ/V2L (wdt0 timeout-sec in the SOM dtsi), ~16 s
# on BCM2835; above it the kernel watchdog core refreshes the hardware and
# enforces the 30 s deadline on PID 1.
RuntimeWatchdogSec=30

# Watchdog held across the shutdown/reboot transition. Catches a stall in the
# reboot path.
RebootWatchdogSec=60
