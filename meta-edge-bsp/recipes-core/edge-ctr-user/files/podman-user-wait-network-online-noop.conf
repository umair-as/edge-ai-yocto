# podman-user-generator makes every rootless Quadlet wait on this unit. It polls
# `systemctl is-active network-online.target` in user scope (never active there)
# and times out after 90s, delaying inference by 90s every boot. The no-op
# ExecStart returns immediately. A drop-in, not a /dev/null mask: a masked user
# unit fails `systemctl preset-all` at do_rootfs ("... is masked").
[Service]
ExecStart=
ExecStart=/bin/true
