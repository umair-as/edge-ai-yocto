# NFS-root coexistence: eth0 is already configured by the kernel via
# `ip=dhcp` on the cmdline (CONFIG_IP_PNP_DHCP) and serves as the
# transport for the NFS rootfs mount. If NM takes ownership and DHCPs
# again, the lease renewal can briefly change link state and kill the
# NFS mount — at best stalls all I/O, at worst panics the kernel.
#
# This file lives in /usr/share/edge-network-profiles/ — outside NM's
# scan path. It is symlinked into /run/NetworkManager/conf.d/ at boot
# by edge-netboot-nm-unmanage.service, gated on
# ConditionKernelCommandLine=root=/dev/nfs. On MMC boots the symlink
# is never created and NM manages eth0 normally — no build-time gate,
# same image for both boot modes.

[keyfile]
unmanaged-devices=interface-name:eth0
