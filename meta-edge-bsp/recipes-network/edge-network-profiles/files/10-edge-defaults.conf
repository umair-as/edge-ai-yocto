# EDGE AI OS NetworkManager defaults.
#
# Embedded device posture: deterministic identity, no surprise renames,
# minimal DBus noise. WiFi/BT are listed in DISTRO_FEATURES so packages
# compile, but no WiFi hardware is wired by default on the SMARC RZ/V2L
# EVK — keep the relevant sections present but inert.

[main]
# resolv.conf management: NM owns it. No systemd-resolved in this build
# (PACKAGECONFIG:remove:pn-systemd dropped it).
dns=default
# Ethernet only; the wifi backend is irrelevant when no WiFi is present.
# Setting it explicitly silences NM startup warnings on the SMARC EVK.
plugins=keyfile
# Static /etc/hostname is the source of truth; skip the DBus round-trip
# to hostnamed at startup (otherwise NM socket-activates it, adding
# ~700 ms to NM's pre-D-Bus-name-acquired phase on cold boot).
hostname-mode=none

[device]
# No interface renaming. Embedded boards run on stable predictable
# names already (eth0 from the RAVB driver); systemd's predictable
# naming logic would rename it under userspace and break the connection
# profile match.
wifi.scan-rand-mac-address=no

[keyfile]
# Ignore non-routable kernel-default net devices NM otherwise enumerates
# at startup (CAN sockets, sit0 IPv6-in-IPv4 tunnel, teql0 trafficeq).
unmanaged-devices=interface-name:can*;interface-name:sit*;interface-name:teql*

[connection]
# Per-connection MAC: preserve hardware MAC. eth0 has a derived stable
# MAC from U-Boot (see 0003-rzg2l-ft_board_setup-add-ethernet-fdt-fixup-
# and-kaslr-seed.patch); randomizing it defeats DHCP reservations.
ethernet.cloned-mac-address=preserve
