BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Recipes/bbappends that target an optional layer. Parsed only when that
# layer's collection is present, so a non-VIRT build doesn't error on a
# dangling bbappend (e.g. container-host-config lives in meta-virtualization).
BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-edge-bsp"
BBFILE_PATTERN_meta-edge-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-edge-bsp = "8"

LAYERSERIES_COMPAT_meta-edge-bsp = "wrynose"
LAYERDEPENDS_meta-edge-bsp = "core meta-rz-bsp meta-rz-distro rauc meta-arm"

LAYERVERSION_meta-edge-bsp = "1"

# Scarthgap→wrynose port: meta-renesas has no wrynose branch upstream,
# its layer.conf sets LAYERSERIES_COMPAT_meta-rz-{bsp,distro} = "scarthgap".
# The bitbake sanity check runs at layer.conf-parse time (before local.conf),
# so the amendment has to be in another layer's layer.conf — ours runs after
# meta-rz-bsp's per BBLAYERS order, and :append is wrynose-late-binding.
# Drop these two lines when meta-renesas ships a wrynose-compatible branch.
LAYERSERIES_COMPAT_meta-rz-bsp:append    = " wrynose"
LAYERSERIES_COMPAT_meta-rz-distro:append = " wrynose"
