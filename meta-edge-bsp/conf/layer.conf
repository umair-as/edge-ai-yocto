BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Recipes and bbappends that target a layer this one does not depend on.
# Parsed only when that layer's collection is present, so a composition
# without it does not error on a dangling bbappend. Four users: container
# integration (container-host-config lives in meta-virtualization), all
# Renesas-targeting content, the Raspberry Pi content (mainline kernel
# provider, U-Boot fragments), and the DEEPX DX-M1 accelerator glue. Each board's vendor content parses only in
# that board's composition, which is what lets this layer compose for a
# board with no meta-renesas at all.
BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bbappend \
    meta-rz-bsp:${LAYERDIR}/dynamic-layers/meta-rz-bsp/recipes-*/*/*.bb \
    meta-rz-bsp:${LAYERDIR}/dynamic-layers/meta-rz-bsp/recipes-*/*/*.bbappend \
    meta-rz-distro:${LAYERDIR}/dynamic-layers/meta-rz-distro/recipes-*/*/*.bb \
    meta-rz-distro:${LAYERDIR}/dynamic-layers/meta-rz-distro/recipes-*/*/*.bbappend \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bb \
    raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bbappend \
    meta-deepx-m1:${LAYERDIR}/dynamic-layers/meta-deepx-m1/recipes-*/*/*.bb \
    meta-deepx-m1:${LAYERDIR}/dynamic-layers/meta-deepx-m1/recipes-*/*/*.bbappend \
"

# Absolute anchor for the layer root. A bbappend under dynamic-layers/ is
# several directories away from the files/ it shares with a recipe that did
# not move, and ${THISDIR}-relative paths would have to walk back out with
# ../../.. -- which breaks silently the moment a file is reshuffled. Set with
# := so it resolves to this layer's path once, here.
EDGE_BSP_LAYERDIR := "${LAYERDIR}"

BBFILE_COLLECTIONS += "meta-edge-bsp"
BBFILE_PATTERN_meta-edge-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-edge-bsp = "8"

LAYERSERIES_COMPAT_meta-edge-bsp = "wrynose"
# No meta-rz-* here. This layer carries generic image/distro integration and
# must compose for a board with no Renesas content at all; a hard dependency
# would make that impossible. The Renesas-targeting bbappends live under
# dynamic-layers/meta-rz-{bsp,distro}/ and are parsed only when those
# collections are present -- the same mechanism used for virtualization above.
# BB_DANGLINGAPPENDS_WARNONLY was removed from bitbake, so a bbappend with no
# recipe is an unconditional error: the dynamic split is what makes the
# accelerator-less and second-board compositions parse at all.
LAYERDEPENDS_meta-edge-bsp = "core rauc meta-arm"

LAYERVERSION_meta-edge-bsp = "1"

# meta-renesas declares scarthgap compat and must be amended from another
# layer's layer.conf. Inert when meta-renesas is not composed. Rationale and
# the removal condition: docs/adr/0002-layer-hosting.md §"Vendor layer series
# compatibility".
LAYERSERIES_COMPAT_meta-rz-bsp:append    = " wrynose"
LAYERSERIES_COMPAT_meta-rz-distro:append = " wrynose"
