# Debug profile: relax hardening clamps that block JTAG/kgdb symbol access,
# dmesg reads, SysRq, and perf. Prefix 99 sorts after systemd's
# 50-default.conf (which sets kernel.sysrq=16), so SysRq=1 actually wins.
# Removed by `edge-debug-mode off`, after which systemd-sysctl restart
# reapplies the hardened/default baseline.
kernel.kptr_restrict = 0
kernel.perf_event_paranoid = -1
kernel.dmesg_restrict = 0
kernel.sysrq = 1
