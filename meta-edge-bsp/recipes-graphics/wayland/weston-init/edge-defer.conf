# Defer weston off the boot critical chain.
#
# edge.conf sets SYSTEMD_DEFAULT_TARGET = "multi-user.target" so the
# boot-complete metric reaches its goal without waiting on the Wayland
# compositor. weston.service is symlinked under multi-user.target.wants/
# (created by the recipe's do_install:append) so it still auto-starts,
# but After=multi-user.target makes it run AFTER multi-user is active —
# in parallel with login on the serial TTY, not gating it.
#
# For the DRP-AI camera→inference→display demo this means: SSH and
# console login come up at the multi-user.target reach time (~16 s on
# steady-state mmc boot), and the HDMI compositor lights up a few
# seconds after, parallel with operator login.
#
# Wait/retry: rzg2l-du encoder init depends on the i2c HDMI bridge
# (1-003d) probing; on NFS-root boots the bring-up order can stretch
# past weston's first start (observed at T+25s while panfrost finishes
# probing at T+28s). After=dev-dri-card0.device gates on the DRM minor
# appearing; Restart=on-failure self-heals if the display stack is
# still settling at first launch (manual `systemctl restart weston`
# succeeded at T+3min, confirming idempotency once the stack is up).
[Unit]
After=multi-user.target dev-dri-card0.device
StartLimitBurst=10
StartLimitIntervalSec=120

[Service]
Restart=on-failure
RestartSec=5
