# Defer compositor start past multi-user.target so it's off the
# boot-complete metric.
# After=dev-dri-card0.device gates on the rzg2l-du / i2c HDMI bridge probe.
# PAMName= drops the upstream weston-autologin session; RuntimeDirectory=weston
# provides XDG_RUNTIME_DIR without going through pam_systemd / logind.
[Unit]
After=multi-user.target dev-dri-card0.device

[Service]
PAMName=
RuntimeDirectory=weston
Environment=XDG_RUNTIME_DIR=/run/weston
Restart=on-failure
RestartSec=5
