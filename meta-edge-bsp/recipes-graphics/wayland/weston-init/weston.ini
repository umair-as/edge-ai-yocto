# EDGE AI OS Weston configuration.
#
# Overrides oe-core's stub weston.ini (recipes-graphics/wayland/
# weston-init/weston.ini) — our bbappend's FILESEXTRAPATHS:prepend
# gives this file precedence when the fetcher resolves
# SRC_URI += "file://weston.ini" in the base recipe.
#
# idle-time=0 disables the screen-blank timeout. Without it, weston's
# default (300s) blanks the HDMI output after ~5 min of inactivity —
# wrong posture for our continuous-display use cases (camera→inference
# →display pipelines, kiosk demos, on-device dashboards).
#
# Other [core] defaults preserved from oe-core's weston.ini:
#   require-input=false  → boot without keyboard/mouse attached
#   repaint-window=10    → 10 ms repaint scheduling
#   require-outputs=none → boot without HDMI connected (deferred to
#                          dev-dri-card0.device probe in edge-defer.conf)

[core]
idle-time=0
require-input=false
repaint-window=10
require-outputs=none

[shell]
background-image=/usr/share/weston/edge-wallpaper.png
background-type=scale-crop

[screen-share]
command=/usr/bin/weston --backend=rdp-backend.so --shell=fullscreen-shell.so --no-resizeable
