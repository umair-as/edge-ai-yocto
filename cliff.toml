# git-cliff configuration — edge-ai-yocto
#
# Pinned to git-cliff 2.13.1 (the version bundled by orhun/git-cliff-action@v4.8.0
# and installed explicitly in .github/workflows/changelog.yml). The Tera template
# syntax and the [git]/[changelog] schema below are validated against 2.13.x; a
# major git-cliff bump may rename keys, so the workflow pins the binary version
# rather than tracking latest.
#
# Input style: Conventional Commits (type(scope): description). 100% of this
# repo's history conforms. Grouping is by commit *type* only — deliberately not
# by scope — so this file lifts unchanged to the Rust crate repos (mcp-serial-rs,
# mcp-netdiag-rs). The only repo-specific value is the GitHub slug, which is
# injected at runtime via the GITHUB_REPO env var (github.repository in CI), not
# hard-coded here.

[changelog]
# Rendered once at the top of CHANGELOG.md; stripped from the --latest release body.
header = """
# Changelog

All notable changes to this project are documented in this file.
Generated by [git-cliff](https://github.com/orhun/git-cliff) from the
Conventional Commit history.\n
"""
# Tera template applied per release section.
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}]\
        {% if remote.github.owner and remote.github.repo and previous.version %} \
            (https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }})\
        {%- endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message }}\
            {% if remote.github.owner and remote.github.repo %} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }})){% endif %}\
            {% if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
# Strip leading/trailing whitespace from the body template.
trim = true
# Remove the postprocessor-introduced repeated blank lines.
postprocessors = []

[git]
# Parse Conventional Commit subjects; drop anything that doesn't conform.
conventional_commits = true
filter_unconventional = true
# Treat the whole subject as the commit message (scopes split out automatically).
split_commits = false

# Clean up commit subjects before grouping.
commit_preprocessors = [
    # Collapse "type(scope): " noise is handled by conventional parsing; here we
    # only scrub trailers that leak into multi-line subjects (defensive — this
    # repo keeps trailers in the body, not the subject).
    { pattern = '\s*Co-authored-by:.*', replace = "" },
    { pattern = '\s*Signed-off-by:.*', replace = "" },
]

# Commits are expected to be Conventional Commits, enforced at the commit-msg
# stage by .pre-commit-config.yaml (decision recorded in ADR-0007). Keep the
# type list below in sync with that hook's allowed types.
#
# First match wins. The <!-- N --> prefixes force section ordering (Features
# before Fixes, etc.) and are stripped from rendered output by `striptags`.
commit_parsers = [
    { message = "^feat",     group = "<!-- 0 -->Features" },
    { message = "^fix",      group = "<!-- 1 -->Bug Fixes" },
    { message = "^perf",     group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactor" },
    { message = "^docs",     group = "<!-- 4 -->Documentation" },
    { message = "^build",    group = "<!-- 5 -->Build System & Layers" },
    { message = "^test",     group = "<!-- 6 -->Testing" },
    { message = "^revert",   group = "<!-- 7 -->Reverts" },
    # Release-noise: hidden from the changelog (operator-confirmed).
    { message = "^chore", skip = true },
    { message = "^ci",    skip = true },
    { message = "^style", skip = true },
    # Anything else that parses as conventional but isn't grouped above.
    { message = ".*", group = "<!-- 8 -->Other", skip = true },
]

# Keep breaking-change commits even if their type is in a skip rule above.
# No `!`/BREAKING CHANGE markers exist in history yet; this wires them for when
# they do (feat!: / fix!: / a "BREAKING CHANGE:" footer).
protect_breaking_commits = true

# Exclude nothing by author/path.
filter_commits = false
# Sort newest-first within a release.
sort_commits = "newest"
# Match the v-prefixed semver release scheme (mirrors the workflow trigger glob).
tag_pattern = "v[0-9]*"
