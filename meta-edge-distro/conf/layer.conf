BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

# Appends whose base recipe exists only when another layer is composed in;
# activated per target-layer collection so the default composition parses.
BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bb \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/recipes-*/*/*.bbappend \
"

# Absolute anchor for this layer, from which the repo root (and keys/ beside
# it) is derived. TOPDIR is build/ for the first board and build/<BOARD>/ for
# every later one, so a TOPDIR-relative path names a different directory per
# board. Set with := so it resolves once, here.
EDGE_DISTRO_LAYERDIR := "${LAYERDIR}"

BBFILE_COLLECTIONS += "meta-edge-distro"
BBFILE_PATTERN_meta-edge-distro = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-edge-distro = "10"

LAYERSERIES_COMPAT_meta-edge-distro = "wrynose"
LAYERDEPENDS_meta-edge-distro = "core"

LAYERVERSION_meta-edge-distro = "1"
