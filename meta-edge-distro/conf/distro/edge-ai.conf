# "edge-ai" — EDGE AI OS distro identity. Platform layers
# (meta-edge-bsp, meta-edge-distro) keep the broader "edge" namespace
# so a future variant (edge-realtime, edge-vision) can reuse them
# without churning BBLAYERS.

DISTRO          = "edge-ai"
DISTRO_NAME     = "EDGE AI OS"
DISTRO_VERSION  = "0.1.0"
# DISTRO_CODENAME unset on purpose: os-release appends "(CODENAME)" to
# VERSION and PRETTY_NAME — leaks into systemd's PID 1 welcome line.
PRETTY_NAME     = "EDGE AI OS ${DISTRO_VERSION}"
SDK_VENDOR      = "-edgeaisdk"
SDK_VERSION     = "${DISTRO_VERSION}"
TARGET_VENDOR   = "-edgeai"
MAINTAINER     ?= "edge-ai-yocto maintainers <maintainers@edge-ai-yocto.dev>"

# Customisation surface. Order matters:
#   1. features — declares EDGE_PROFILE / EDGE_OTA_BACKEND / EDGE_ENABLE_*
#                 (need to resolve before the ${...}-suffixed requires)
#   2. (OVERRIDES picks up the profile key)
#   3. floor    — non-negotiables; base DISTRO_FEATURES; SBOM/CVE; FIT signing
#   4. profile  — tier-specific decisions (prod | dev)
#   5. ota      — backend wiring (rauc, …)
#   6. users    — root + devel + password hash + ssh key
require conf/distro/include/edge-features.inc
OVERRIDES .= ":${EDGE_PROFILE}"
require conf/distro/include/edge-floor.inc
require conf/distro/include/edge-profile-${EDGE_PROFILE}.inc
require conf/distro/include/edge-ota-${EDGE_OTA_BACKEND}.inc
require conf/distro/include/edge-users.inc
