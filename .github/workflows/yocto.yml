name: Yocto check

# Operator-dispatched only. Runs on the self-hosted runner the operator starts
# by hand on the build host (docs/dev/ci.md). Nothing here runs on push,
# pull_request or schedule: the repo is public and a self-hosted runner must
# never execute code it did not get from the operator.
on:
  workflow_dispatch:
    inputs:
      matrix:
        description: "parse matrix"
        type: choice
        options: [quick, full]
        default: quick
      build:
        description: "boards to image + bundle, comma-separated (empty = parse only)"
        type: string
        default: ""
      khc:
        description: "kernel-hardening gate on the prod kernel .config, both boards"
        type: boolean
        default: false

permissions:
  contents: read

# One bitbake per host; a second dispatch waits for the first.
concurrency:
  group: yocto-host
  cancel-in-progress: false

jobs:
  yocto:
    runs-on: [self-hosted, yocto-host]
    timeout-minutes: 300
    steps:
      # No checkout: `make ci` runs in the operator's checkout (EDGE_REPO from
      # the runner's .env) and makes its own worktree of the dispatched commit.
      # The run is the check; no commit status is posted.
      - name: make ci
        env:
          REF: ${{ github.sha }}
          MATRIX: ${{ inputs.matrix }}
          BUILD: ${{ inputs.build }}
          KHC: ${{ inputs.khc }}
        # An explicit `bash` runs with -o pipefail; the default shell does not,
        # and `make … | tee` would then report tee's status, not make's.
        shell: bash
        run: |
          # bash reads a single quote inside "${…:?…}" as an opening quote.
          : "${EDGE_REPO:?EDGE_REPO is not set in the runner .env file}"
          echo "::add-mask::$HOME"
          echo "::add-mask::$EDGE_REPO"
          # BUILD reaches a shell through CI_ARGS.
          [[ "$BUILD" =~ ^[a-z0-9,]*$ ]] || { echo "invalid build input: $BUILD"; exit 1; }
          args="--ref $REF --matrix $MATRIX --no-status"
          [ -n "$BUILD" ] && args="$args --build $BUILD"
          [ "$KHC" = "true" ] && args="$args --khc"
          rc=0
          make --no-print-directory -C "$EDGE_REPO" ci CI_ARGS="$args" 2>&1 \
            | sed -u "s#$HOME#~#g" | tee "$RUNNER_TEMP/ci.out" || rc=$?
          { echo '```'; cat "$RUNNER_TEMP/ci.out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
