# Accelerator fragment: DEEPX DX-M1 (PCIe M.2 NPU, Raspberry Pi 5).
#
# Selects the accelerator and adds the vendor layer that carries its driver
# (dx-driver, out-of-tree PCIe + runtime chardev modules) and runtime (dx-rt,
# the dxrtd daemon and libdxrt). The project-side glue -- service account,
# device policy, packagegroup, inference Quadlet -- lives in
# meta-edge-bsp/dynamic-layers/meta-deepx-m1/, parsed only when this layer is
# composed.
#
#   make dev BOARD=raspberrypi5            # the machine fragment composes this
#
# EDGE_ACCEL is checked against the machine's EDGE_ACCEL_SUPPORTED in
# edge-image.bbclass. An unsupported pair is a parse error naming both.
#
# Every DEEPX package is LICENSE = "Proprietary" under a customer licence: the
# recipes and this composition are publishable, an image or bundle built from
# them is not. EDGE_ACCEL_PROPRIETARY marks the artifacts (edge-image.bbclass).
#
# The DX-M1 firmware lives on the card, not in the image; the runtime refuses
# inference against a firmware older than it requires. Firmware delivery is
# outside this composition.
header:
  version: 19

repos:
  meta-deepx-m1:
    url: https://github.com/DEEPX-AI/meta-deepx-m1.git
    # walnascar (Yocto 5.2) branch tip. One release from wrynose rather than
    # four, a single dx-driver version and the newest driver SRCREV. Neither
    # upstream branch is wrynose-compatible on its own; see the patches.
    branch: walnascar
    commit: 703831e7aacd7a6d18b0291a94e99aa59bf9113e
    # The layer sits at the repo root.
    layers:
      .:
    patches:
      # LAYERSERIES_COMPAT cannot be amended from local.conf: bitbake reads it
      # right after parsing each layer.conf and deletes the variable
      # (lib/bb/cookerdata.py). Patching the layer is the only route.
      wrynose-compat:
        repo: edge-ai-yocto
        path: kas/patches/meta-deepx-m1/0001-layer.conf-declare-wrynose-compatibility.patch
      # dx-rt's do_install runs pip with build isolation, which fetches
      # setuptools from PyPI; bitbake gives do_install no network. The fix
      # belongs inside upstream's pip invocation, which a bbappend cannot edit.
      dx-rt-no-build-isolation:
        repo: edge-ai-yocto
        path: kas/patches/meta-deepx-m1/0002-dx-rt-no-build-isolation.patch

local_conf_header:
  accel_dxm1: |
    EDGE_ACCEL = "dxm1"

    # The edge-ctr rootless principal joins the dxrt group so /dev/dxrt0
    # (root:dxrt 0660, edge-dxm1-runtime) can be passed into its container
    # with keep-groups. Applied at image assembly by edge-users.inc.
    EDGE_ACCEL_SUPPLEMENTARY_GROUPS = "dxrt:edge-ctr"
    # Measurement instruments for dev tiers; none beyond dx-rt's own tools yet.
    EDGE_ACCEL_TEST_INSTALL = ""

    # DEEPX packages are proprietary: images and bundles carrying them are
    # not redistributable. Consumed by edge-image.bbclass.
    EDGE_ACCEL_PROPRIETARY = "1"
