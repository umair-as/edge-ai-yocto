# Machine overlay: Raspberry Pi 5.
#
# Composes onto kas/base.yml. Second machine of the platform; the board facts
# (slot devices, U-Boot env area, FIT addresses, boot artifacts) live in
# meta-edge-bsp/conf/machine/include/edge-board-raspberrypi5.inc, pulled in
# by MACHINE name from edge-ai.conf. This file is composition only.
#
# The DEEPX DX-M1 on the PCIe M.2 slot is this board's accelerator; it is
# composed here the way kas/machines/rzv2l.yml composes DRP-AI. An image for
# this board without it has no purpose.

header:
  version: 19
  includes:
    # Raspberry Pi vendor BSP: the meta-raspberrypi repo pin, its layer, and
    # (via that file) the mainline kernel provider selection.
    - kas/bsp/raspberrypi.yml
    # DEEPX DX-M1: the vendor layer, its wrynose patches and the accelerator
    # selection.
    - kas/accel/dxm1.yml

machine: raspberrypi5

local_conf_header:
  board: |
    # Debug UART on the 3-pin header (ttyAMA10). rpi-config writes
    # enable_uart=1 into config.txt; RPI_USE_U_BOOT requires it.
    ENABLE_UART = "1"

    # Headless bring-up. Mainline 6.18 carries no validated display path for
    # BCM2712 in this composition, and rpi-config would otherwise emit a
    # dtoverlay=vc4-kms-v3d line for an overlay the mainline kernel does not
    # ship. No display toggle, no vc4graphics machine feature, and no
    # "screen" feature (psplash needs a framebuffer the image cannot provide).
    # Read by rpi-base.inc at machine-conf parse, so local.conf scope.
    EDGE_ENABLE_DISPLAY = "0"
    DISABLE_VC4GRAPHICS = "1"
    MACHINE_FEATURES_OPTED_OUT:append = " screen touchscreen"

    # On-board WiFi (Synaptics/Cypress 43455 over SDIO) is wanted on this
    # board. Its firmware is license-flagged; accepting the flag here keeps
    # the acceptance machine-scoped. The wifi distro feature pulls the
    # userspace (wpa-supplicant, iw) via packagegroup-base; the kernel side
    # is the board's wireless-rpi5.cfg fragment, which re-enables the
    # 802.11 stack the platform policy turns off for radio-less boards.
    LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch"
    DISTRO_FEATURES:append = " wifi"

    # No wireless. security-hardening.cfg builds the kernel without
    # CONFIG_WIRELESS/WLAN on every board, so the Synaptics WiFi/BT firmware
    # raspberrypi5.conf recommends would never load; it is also license-flagged
    # (synaptics-killswitch), and an unaccepted flag makes the recommend an
    # unbuildable dependency rather than a skipped one.
    MACHINE_FEATURES_OPTED_OUT:append = " wifi bluetooth"
    MACHINE_EXTRA_RRECOMMENDS:remove = " \
        linux-firmware-rpidistro-bcm43455 \
        bluez-firmware-rpidistro-bcm4345c0-hcd \
        linux-firmware-rpidistro-bcm43456 \
        bluez-firmware-rpidistro-bcm4345c5-hcd \
    "

    # rpi-default-providers.inc maps the GL virtuals to the legacy VideoCore
    # "userland" stack whenever vc4graphics is off. That stack is not for
    # BCM2712; pin mesa so anything that still links a GL virtual builds the
    # same provider the display-enabled composition would.
    PREFERRED_PROVIDER_virtual/egl     = "mesa"
    PREFERRED_PROVIDER_virtual/libgles2 = "mesa"
    PREFERRED_PROVIDER_virtual/libgl   = "mesa"
    PREFERRED_PROVIDER_virtual/mesa    = "mesa"
    PREFERRED_PROVIDER_virtual/libgbm  = "mesa"
