# Machine overlay: Renesas RZ/V2L SMARC EVK.
#
# Composes onto kas/base.yml. Inlines the machine pick
# directly so this repo fully owns the machine selection.
#
# Pulls in the Renesas-fork TF-A and U-Boot pins here, not in base.yml.
# base.yml is board-neutral distro policy; this file is where RZ/V2L's
# bootloader stack — TF-A + U-Boot + (via TF-A's bbappend) bptool — gets
# wired. A second board (i.MX93, VF2, …) will ship its own machines/<b>.yml
# including its own kas/{trusted-firmware-a,u-boot}/<flavor>.yml.

header:
  version: 19
  includes:
    # Vendor kernel recipe pin. BSP policy, not distro policy: the recipe
    # name is specific to meta-renesas, and a second machine brings its own
    # provider. Was included from kas/base.yml, where it applied to every
    # machine. Without it meta-renesas's weak "6.1%" default wins and the
    # build silently produces a 6.1 kernel instead of 6.12-cip14.
    - kas/bsp/renesas-rz-kernel.yml
    - kas/trusted-firmware-a/renesas-cip-2.10.yml
    - kas/u-boot/renesas-cip-2024.07.yml

machine: smarc-rzv2l

local_conf_header:
  # PMIC_SUPPORT stays at local.conf scope: smarc-rzv2l.conf:44 reads it to
  # pick its WKS_FILE, and the vendor machine conf parses at
  # bitbake.conf:825 -- before the board include at :828. Setting it in
  # conf/machine/include/edge-board-smarc-rzv2l.inc would be too late.
  # Every other board fact moved there.
  pmic: |
    # Build the PMIC variants of BL2/BL31/FIP. The SMARC RZ/V2L EVK
    # DDR4 carrier ships with the Renesas RAA215300 PMIC; BL2's DDR/
    # regulator bring-up needs the PMIC init path or it traps before
    # reaching BL31 (banner-then-reset loop on serial). This matches
    # meta-renesas's own default for smarc-rzv2l.conf:36.
    #
    # The QA bridging — meta-renesas's :rzg2l-family installs _pmic
    # variants at the legacy /firmware/ path; meta-arm's FIRMWARE_DIR is
    # /firmware/${PN}/, so the files would be installed-but-not-shipped
    # AND missing from sysroot (firmware-pack reads from sysroot/PN). The
    # trusted-firmware-a_%.bbappend mirrors the _pmic files into
    # FIRMWARE_DIR so SYSROOT_DIRS picks them up, and claims the legacy
    # /firmware/ copies in FILES:${PN} so QA passes. Originals stay where
    # meta-renesas put them — that keeps its do_deploy:append (which cp's
    # from /firmware/*pmic.bin → DEPLOYDIR) working untouched.
    PMIC_SUPPORT = "1"
