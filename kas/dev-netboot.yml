# Capability fragment: dev-only TFTP/NFS netboot wiring.
#
# Self-contained: pure additive overlay. No `includes:`. Compose with
# the base+machine stack at invocation time:
#   kas build kas/base.yml:kas/machines/<board>.yml:kas/dev-netboot.yml
#   make dev NETBOOT=1                            # via Makefile flag
#
# Sets EDGE_DEV_NETBOOT=1 in local.conf so:
#   - rauc-uboot-env_1.0.bb appends a `netboot` macro to
#     /etc/rauc-uboot-env.defaults and /etc/u-boot-initial-env
#   - prod builds composed without this fragment carry zero netboot bytes
#
# The NFS-root interface is left unmanaged by systemd-networkd so the
# kernel's ip=dhcp path is not disrupted, and a second interface carries the
# DHCP uplink. The same image works netbooted or flashed, with no
# netboot-specific network gating.
#
# Interface roles are board facts (EDGE_UNMANAGED_IFACES, EDGE_UPLINK_IFACE
# in the board include), not properties of this fragment.
#
# NFS-root needs CONFIG_NFS_FS, CONFIG_NFS_V4, CONFIG_ROOT_NFS,
# CONFIG_IP_PNP_DHCP and the board's Ethernet/PHY drivers built in.
# rz_linux-cip builds all of them in; other providers are unverified.
#
# Host-side setup (TFTP + NFS server, exports, sync workflow) is
# documented in docs/dev/netboot-setup.md and automated by
# scripts/dev/sync-nfs-rootfs.sh — not part of the image.
#
# The default bootcmd (signed FIT from mmc) is unchanged. `run netboot`
# is operator-typed at the U-Boot prompt; power-cycle = signed mmc boot.

header:
  version: 19

local_conf_header:
  dev_netboot: |
    EDGE_DEV_NETBOOT = "1"
