# Canonical, tracked KAS composition for edge-ai-yocto.
#
# Single source of truth for the layer set, pin policy, and base
# local.conf. Self-contained — wrynose and kernel composition are
# transcribed here so this repo owns and curates its own layer set.
#
# Pinning policy:
#   - Upstream Yocto layers (openembedded-core, bitbake, meta-yocto,
#     meta-arm, meta-openembedded) are SHA-pinned. The starting baseline
#     mirrors the community BSP's wrynose.yml as of rz-community-bsp
#     commit 24d43a0 (2026-06). Bump SHAs deliberately, not by drift.
#   - Project-local layers (meta-edge-distro, meta-edge-bsp) live in-tree
#     via `path:`.
#
# Composition:
#   kas build kas/base.yml:kas/machines/<board>.yml:kas/images/<tier>.yml
# or via the wrapper:
#   make base

header:
  version: 19

distro: edge-ai

# Default bitbake target when invoked outside the Makefile (e.g.
# `kas build kas/base.yml:kas/machines/<board>.yml`). The make targets
# (`make base|dev|prod`) override this by passing an explicit bitbake
# argument; this value only steers `kas build` / `kas shell` invocations
# and the post-checkout banner ("To start the default build, run: ...").
target: edge-image-base

repos:
  # --- Yocto upstream layers (SHA-pinned to the wrynose 6.0 baseline) ---
  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    # wrynose branch tip, 2026-07-30 (bumped from the yocto-6.0 tag to pull
    # ~3 months of stable-branch CVE backports and recipe updates)
    commit: f09a0f28aeb54ddd90415dd458338e1565bb5a49
    layers:
      meta:

  bitbake:
    url: https://git.openembedded.org/bitbake
    # 2.18 branch tip, 2026-07-09 (still 2.18.0; moves with the poky cluster)
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers:
      bitbake: disabled

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    # wrynose branch tip, 2026-07-30 (poky cluster: moves with oe-core/bitbake)
    commit: 1b132647002eea43a2c7a7f857f63f42dacbc26c
    layers:
      meta-poky:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    # wrynose HEAD at baseline
    commit: 052c2cf333ecf16fc2ded4c5d09749ebaff8c0c5
    layers:
      meta-arm-toolchain:
      meta-arm:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    # wrynose branch tip, 2026-08-07 (moves in lockstep with the poky cluster;
    # shares oe-core's class/python API, carries userland CVE backports)
    commit: 6bf0d8ad57b33950bab4c7f6c037e1ccb6f6e2eb
    # All meta-oe sublayers any edge image might need are activated here.
    # meta-networking + meta-filesystems are parse-only for edge-image-base
    # (no packagegroup pulls from them); edge-image-dev consumes them via
    # packagegroup-edge-netdiag + packagegroup-edge-storage. LAYERDEPENDS
    # ordering: meta-networking needs meta-python; meta-filesystems needs
    # meta-networking. bitbake validates the chain at parse.
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  # --- RAUC OTA framework (wrynose branch, pinned) ---
  # meta-rauc-community is NOT used here — the per-board helper
  # bits (system.conf, bundle hooks, slot udev rules) live in
  # meta-edge-bsp in-tree. Reconsider only if upstream meta-rauc-community
  # grows a generic, consumable helper layer.
  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: wrynose
    commit: 38da0e5866a953e664001ba90b5edad68d68cd5d
    # meta-rauc.git has the layer at the repo root, not in a subdir.
    layers:
      .:

  # --- SELinux (MAC) ---
  # Provides libselinux/libsemanage/libsepol, policycoreutils, refpolicy
  # variants, packagegroup-core-selinux, and selinux-image.bbclass. Layer
  # deps (openembedded-core, meta-python) are already pulled above. The
  # systemd recipe in oe-core flips PACKAGECONFIG[selinux] automatically
  # when DISTRO_FEATURES contains "selinux"; 25 other oe-core/meta-oe
  # recipes link libselinux conditionally on the same bit. See
  # edge-floor.inc for the distro-features wiring and
  # security-hardening.cfg for the kernel-side LSM symbols.
  meta-selinux:
    url: https://git.yoctoproject.org/meta-selinux
    branch: wrynose
    commit: 1c3a699f363167571ab39fecb0fe6f56691a4e20
    layers:
      .:

  # --- Container runtime -------------------------------------------------
  # Baseline, not a capability: every tier and every machine ships the
  # container userspace (ADR-0012). meta-virtualization LAYERDEPENDS on
  # core + openembedded-layer (meta-oe), both already composed above.
  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: wrynose
    commit: 781735b97ae5013cacabbecd38e6da6b510cf3fb
    layers:
      .:

  # --- Project-local layers ---
  # No url/path: this entry references the repo where this config file
  # lives (edge-ai-yocto itself). Layer paths under `layers:` are
  # relative to that repo root. Avoids the `path:`-vs-KAS_WORK_DIR
  # interaction: with KAS_WORK_DIR=.kas/, a bare `path: meta-edge-bsp`
  # resolves to .kas/meta-edge-bsp (wrong); the implicit-current-repo
  # form sidesteps that entirely.
  edge-ai-yocto:
    layers:
      meta-edge-bsp:
      meta-edge-distro:

  # Slot reserved for a future meta-edge-ai sibling repo (model
  # packaging, AI-SBOM, multi-board AI layers). DRP-AI runtime recipes
  # landed in-tree under meta-edge-bsp; uncomment if a separate AI
  # layer is introduced.
  #
  # meta-edge-ai:
  #   url: https://github.com/umair-as/meta-edge-ai
  #   branch: main
  #   commit: <pin>
  #   layers:
  #     meta-edge-ai:

# Base local.conf header. Disk-monitor thresholds halt the build when
# TMPDIR / DL_DIR / SSTATE_DIR run low so partial-write artifacts don't
# corrupt sstate; rpm packaging matches the CIP-aligned distro intent;
# BB_GENERATE_MIRROR_TARBALLS lets DL_DIR double as a reproducible
# offline mirror.
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    # Disk guard. Raised from poky's stock 1G/100M, which is far too
    # low for a tree of this size: a full image build consumes tens of GiB, so a
    # STOPTASKS floor of 1 GiB only fires once the disk is already effectively
    # full, and a 100 MiB HALT fires after the damage is done. TMPDIR lives on
    # the operator's home filesystem, so an unguarded runaway is not merely a
    # failed build.
    #
    # Format is ACTION,DIR,MIN_FREE_SPACE,MIN_FREE_INODES. The value is the free
    # space that must REMAIN — the action fires when free space drops below it.
    # STOPTASKS must therefore sit ABOVE HALT: finish running tasks and schedule
    # no more (recoverable, sstate resumes), and only hard-kill if space keeps
    # falling. A HALT is not clean — a task killed mid-write is a known cause of
    # a corrupt pseudo database.
    #
    # /tmp deliberately keeps smaller thresholds: it is a small scratch tmpfs,
    # not a build output tree, and a 15G floor there would trip permanently.
    BB_DISKMON_DIRS ?= " \
        STOPTASKS,${TMPDIR},15G,100K \
        STOPTASKS,${DL_DIR},15G,100K \
        STOPTASKS,${SSTATE_DIR},15G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},10G,1K \
        HALT,${DL_DIR},10G,1K \
        HALT,${SSTATE_DIR},10G,1K \
        HALT,/tmp,10M,1K \
    "
    PACKAGE_CLASSES ?= "package_rpm"
    BB_GENERATE_MIRROR_TARBALLS = "1"

# No vendor BSP here. The Renesas repo pin, its layers, its kas patch and its
# BBMASKs live in kas/bsp/renesas-rz.yml, composed by kas/machines/rzv2l.yml.
# This file is board-neutral: adding a second machine must not require editing
# it.
