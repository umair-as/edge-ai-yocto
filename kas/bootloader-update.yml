# Capability fragment: install the board's bootchain updater (ADR-0014).
# Additive overlay, no layers. Machine-gated in the image recipes: RZ/V2L
# BL2/FIP updater, Pi 5 EEPROM + boot-file updaters; no-op on other boards.
# Off by default — it rewrites single-copy bootchain storage.
header:
  version: 19

local_conf_header:
  bootloader_update: |
    EDGE_ENABLE_BOOTLOADER_UPDATE = "1"
