<text x="325.0" y="621.0" font-size="11.5" fill="#64748B" text-anchor="middle" font-family="'JetBrains Mono', 'IBM Plex Mono', 'DejaVu Sans Mono', monospace">hostile-archive rules</text>
<rect x="482.0" y="573.0" width="218.0" height="66" rx="10" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.4" stroke-dasharray="5,4" opacity="0.6"/>
<text x="591.0" y="601.0" font-size="14.5" font-weight="600" fill="#0F172A" text-anchor="middle">model store</text>
<text x="591.0" y="621.0" font-size="11.5" fill="#64748B" text-anchor="middle" font-family="'JetBrains Mono', 'IBM Plex Mono', 'DejaVu Sans Mono', monospace">active + previous digest</text>
<rect x="748.0" y="573.0" width="218.0" height="66" rx="10" fill="#FFFFFF" stroke="#D3DAE6" stroke-width="1.4" stroke-dasharray="5,4" opacity="0.6"/>
