<rect x="742.0" y="431.0" width="490.0" height="66" rx="10" fill="#EEF0FE" stroke="#4F46E5" stroke-width="1.8"/>
<text x="987.0" y="459.0" font-size="14.5" font-weight="600" fill="#4F46E5" text-anchor="middle">verify digest</text>
<text x="987.0" y="479.0" font-size="11.5" fill="#64748B" text-anchor="middle" font-family="'JetBrains Mono', 'IBM Plex Mono', 'DejaVu Sans Mono', monospace">before anything is unpacked</text>
