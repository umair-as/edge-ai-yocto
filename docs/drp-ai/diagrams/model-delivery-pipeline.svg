<path d="M 1123.0 639.0 L 1123.0 692.0 L 591.0 692.0 L 591.0 643.0" fill="none" stroke="#9AA6B8" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arw)"/>
<text x="857.0" y="709.0" font-size="11" fill="#64748B" text-anchor="middle" font-weight="600">rollback: re-point the ref at the previous digest, already in the store</text>
<text x="48" y="748" font-size="12" fill="#94A3B8">Rollback never re-downloads and never re-extracts: the previous digest stays in the store, so reverting is the same atomic reference switch as activating.</text>
