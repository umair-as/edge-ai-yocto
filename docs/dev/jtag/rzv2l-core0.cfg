# RZ/V2L (R9A07G054L) — SINGLE-CORE OpenOCD config (Cortex-A55 core 0 only).
# Olimex ARM-USB-TINY-H -> ARM-JTAG-20-10 -> carrier 10-pin Cortex header.
#
#   openocd -f docs/dev/jtag/rzv2l-core0.cfg
#   openocd -s <from-source-build>/tcl -f docs/dev/jtag/rzv2l-core0.cfg
#
# WHY a single-core config: the stock renesas_rz target puts both A55s in a
# `target smp` group. OpenOCD then mirrors every breakpoint to ALL group
# members — including a55.1, which is defer-examine (unattached) — so the
# insert fails ("can't add breakpoint: resource not available") and the
# breakpoint dies. Declaring ONLY a55.0 (no SMP group, no a55.1) lets HW
# breakpoints land cleanly, and leaves a55.1 genuinely running Linux — pin the
# eMMC IRQ to it (see README) so a sustained a55.0 halt doesn't wedge the rootfs.
#
# Use rzv2l-openocd.cfg (full SMP target) for scan / registers / backtrace;
# use this file for breakpoints and single-stepping. Values (DAP id, dbgbase,
# CTI base, ap-num) are from the upstream renesas_rz target file.

source [find interface/ftdi/olimex-arm-usb-tiny-h.cfg]
transport select jtag
adapter speed 4000

set _CHIPNAME r9a07g054l
jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
    -expected-id 0x6ba00477 -ignore-version
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Cortex-A55 core 0 only — no SMP group.
cti create $_CHIPNAME.a55.0.cti -dap $_CHIPNAME.dap -ap-num 0 -baseaddr 0x10E20000
target create $_CHIPNAME.a55.0 aarch64 -dap $_CHIPNAME.dap -ap-num 0 \
    -dbgbase 0x10E10000 -cti $_CHIPNAME.a55.0.cti

reset_config none
