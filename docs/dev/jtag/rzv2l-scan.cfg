# RZ/V2L scan-chain probe — read the DAP IDCODE off the scan chain.
# Pair with an interface cfg:
#   openocd -f interface/ftdi/olimex-arm-usb-tiny-h.cfg -f docs/dev/jtag/rzv2l-scan.cfg
# No halt, no reset asserted — just listen. Expect r9a07g054l.cpu and a DAP
# IDCODE of 0x6ba00477.

transport select jtag
adapter speed 1000

# Don't drive nTRST/nSRST during a pure scan.
reset_config none

# RZ/V2L Arm CoreSight DAP. irlen/ircapture/irmask match the upstream Renesas
# RZ target file. expected-id 0x6ba00477 = standard Cortex-A class DAP IDCODE.
jtag newtap r9a07g054l cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x6ba00477

init
scan_chain
shutdown
