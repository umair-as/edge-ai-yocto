# RZ/V2L (R9A07G054L) OpenOCD board config.
# Olimex ARM-USB-TINY-H -> ARM-JTAG-20-10 -> carrier 10-pin Cortex debug header.
#
# Brings up the full target (A55 x2 + M33 + AXI mem-AP) and the GDB servers
# (:3333 Cortex-A55, :3334 Cortex-M33). For a passive scan-only check instead,
# use rzv2l-scan.cfg in this directory.
#
# Run (Ubuntu 24.04 ships OpenOCD 0.12.0 with both files below on its search
# path, so no -s flag is needed):
#   openocd -f docs/dev/jtag/rzv2l-openocd.cfg
#   openocd -s <from-source-build>/tcl -f docs/dev/jtag/rzv2l-openocd.cfg
#
# Target-file selection (depends on OpenOCD version):
#   - mainline OpenOCD with the V2L addition (post-0.12.0) — swap the two
#     SOC lines below for:
#         set SOC V2L
#         source [find target/renesas_rz.cfg]      ;# _CHIPNAME r9a07g054l
#   - 0.12.0 and older ship only renesas_rz_g2.cfg — keep SOC=G2L: RZ/G2L and
#     RZ/V2L share the A55 DAP (TAP id 0x6ba00477), CTI, and debug bases, so
#     SOC=G2L drives a V2L A55 correctly (target names are r9a07g044l.*).
#
# Board prerequisite: SW1-1 = OFF on the SMARC module asserts RZ_DEBUGEN.

source [find interface/ftdi/olimex-arm-usb-tiny-h.cfg]

set SOC G2L
source [find target/renesas_rz_g2.cfg]
# (transport=jtag, adapter speed, TAP, and the A55/M33/AXI targets are all
#  declared by the sourced Renesas target file.)

# After `init`, select the boot A55 before `halt` — the AXI mem-AP is created
# last and is otherwise the default current target:
#   openocd -f docs/dev/jtag/rzv2l-openocd.cfg \
#           -c init -c "targets r9a07g044l.a55.0" -c halt -c "reg pc" -c resume -c shutdown
# Omit shutdown to leave the GDB server listening on :3333 for gdb-multiarch.
